// ─────────────────────────────────────────────────────
// INFO TAB
// ─────────────────────────────────────────────────────
function InfoTab({terreno, ufClp=40027, cuotas=[], devoluciones=[], bitacora=[], onUpdated, user, oculto=false}) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({...terreno});
  const [saving, setSaving] = useState(false);
  const [expandM2, setExpandM2] = useState(false);
  const [expandAv, setExpandAv] = useState(false);
  const [expandUf, setExpandUf] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  // ── Historial de avalúos ──
  // En "Editar información" el avalúo queda bloqueado. Se cambia de dos formas:
  //   "nuevo"    → reavalúo: el avalúo vigente pasa a avaluos_historial y el nuevo rige desde avDesde.
  //   "corregir" → error de tipeo: se reemplaza el valor sin dejar registro en el historial.
  const [avMode, setAvMode] = useState(null); // null | "nuevo" | "corregir"
  const [avDesde, setAvDesde] = useState("");
  const [histAv, setHistAv] = useState([]);
  const [histTick, setHistTick] = useState(0); // se incrementa para volver a cargar el historial
  useEffect(() => {
    let vivo = true; // descarta la respuesta si entretanto se cambió de terreno
    setHistAv([]);
    db.select("avaluos_historial","terreno_rol=eq."+encodeURIComponent(terreno.rol)+"&order=vigente_hasta.desc.nullslast,created_at.desc")
      .then(r=>{ if(vivo) setHistAv(r||[]); })
      .catch(()=>{ if(vivo) setHistAv([]); });
    return () => { vivo = false; };
  }, [terreno.rol, histTick]);
  const histAvOrd = [...histAv].sort((a,b)=>
    String(b.vigente_hasta||"").localeCompare(String(a.vigente_hasta||"")) || String(b.created_at||"").localeCompare(String(a.created_at||"")));
  const periodoAv = h => h.vigente_desde
    ? `${fmtDate(h.vigente_desde)} → ${h.vigente_hasta?fmtDate(h.vigente_hasta):"—"}`
    : `hasta ${h.vigente_hasta?fmtDate(h.vigente_hasta):"—"}`;

  // Resincronizar el form cuando cambia el terreno seleccionado
  useEffect(() => {
    setForm({...terreno});
    setEditing(false);
    setExpandM2(false); setExpandAv(false); setExpandUf(false);
    setAvMode(null);
  }, [terreno.rol]);

  // Helpers para desglose.
  // OJO: los valores que llegan acá YA están normalizados (punto = decimal):
  // vienen como número desde la DB, o como string producido por parseCLInput().
  // No se deben quitar los puntos acá — hacerlo borraba el decimal y
  // multiplicaba los m²/avalúo por 10 o 100 al guardar.
  const numOrNull = (v) => {
    if(v===null||v===undefined||v==="") return null;
    const n = parseFloat(String(v).replace(",","."));
    return isNaN(n) ? null : n;
  };
  const m2Eri = numOrNull(form.m2_sii_eriazo);
  const m2Con = numOrNull(form.m2_sii_construido);
  const hasM2Break = m2Eri!==null || m2Con!==null;
  const m2Total = hasM2Break ? ((m2Eri||0)+(m2Con||0)) : (numOrNull(form.m2_sii)||0);
  const avEri = numOrNull(form.avaluo_eriazo);
  const avCon = numOrNull(form.avaluo_construido);
  const hasAvBreak = avEri!==null || avCon!==null;
  const avTotal = hasAvBreak ? ((avEri||0)+(avCon||0)) : (numOrNull(form.avaluo)||0);
  const ufm2Total = (avTotal>0 && m2Total>0 && ufClp>0) ? (avTotal/ufClp)/m2Total : null;
  const ufm2Eri = (avEri!==null && m2Eri!==null && m2Eri>0 && ufClp>0) ? (avEri/ufClp)/m2Eri : null;
  const ufm2Con = (avCon!==null && m2Con!==null && m2Con>0 && ufClp>0) ? (avCon/ufClp)/m2Con : null;
  const hasUfBreak = ufm2Eri!==null || ufm2Con!==null;
  const fmtUF = (v) => v===null || v===undefined ? "—" : Number(v).toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2})+" UF";
  // Equivalente en UF de un monto en pesos, con la tasa UF vigente de la pagina.
  // Al venir ufClp por props, se recalcula solo cuando alguien edita la UF.
  // Devuelve null si no hay tasa o el monto es 0, para no mostrar un parentesis vacio.
  const clpEnUF = (clp) => {
    const n = parseFloat(clp)||0;
    if(!(ufClp>0) || n<=0) return null;
    return Math.round(n/ufClp).toLocaleString("es-CL")+" UF";
  };
  const avTotalUF = clpEnUF(avTotal);

  const abrirAvMode = (modo) => {
    setAvMode(modo);
    setAvDesde(modo==="nuevo" ? today() : String(terreno.avaluo_vigente_desde||"").slice(0,10));
  };
  const cancelarAvMode = () => {
    setForm(f=>({...f, avaluo:terreno.avaluo, avaluo_eriazo:terreno.avaluo_eriazo, avaluo_construido:terreno.avaluo_construido}));
    setAvMode(null);
  };

  const save = async () => {
    const nom = form.terreno||terreno.terreno;
    const proj = `${nom} · ${terreno.rol}`;
    const redondo = v => (v===null||v===undefined||v==="") ? null : Math.round(Number(v));
    const oldTotal = parseInt(terreno.avaluo)||0;
    const newTotal = Math.round(avTotal||0);
    const mismoAvaluo = newTotal===oldTotal
      && redondo(avEri)===redondo(terreno.avaluo_eriazo)
      && redondo(avCon)===redondo(terreno.avaluo_construido);
    const desdeActual = String(terreno.avaluo_vigente_desde||"").slice(0,10);
    if(avMode==="nuevo"){
      if(newTotal<=0){alert("Ingresa el nuevo avalúo.");return;}
      if(mismoAvaluo){alert("El nuevo avalúo es igual al actual. Ingresa el nuevo valor o cancela la actualización.");return;}
      if(!avDesde){alert("Indica desde cuándo rige el nuevo avalúo.");return;}
      if(desdeActual && avDesde<=desdeActual){alert("El nuevo avalúo debe regir después del actual (vigente desde "+fmtDate(desdeActual)+").");return;}
    }
    setSaving(true);
    let histId = null;
    try{
      // 1) Reavalúo: el avalúo vigente se guarda primero en el historial.
      if(avMode==="nuevo" && oldTotal>0){
        histId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : null;
        await db.insert("avaluos_historial",[{
          ...(histId?{id:histId}:{}),
          terreno_rol: terreno.rol,
          avaluo: oldTotal,
          avaluo_eriazo: redondo(terreno.avaluo_eriazo),
          avaluo_construido: redondo(terreno.avaluo_construido),
          vigente_desde: desdeActual||null,
          vigente_hasta: avDesde,
          reemplazado_por: (user && user.email) || null
        }]);
      }
      // 2) Luego se actualiza el terreno. Si esto falla, se deshace el paso 1 para no dejar el
      //    avalúo vigente duplicado en el historial.
      const cambios = {
        terreno:form.terreno, estado:estadoDe(form), vigente:estadoDe(form)==="Activo"?"SI":"NO", ciudad:form.ciudad,
        m2_sii: m2Total||0,
        avaluo: newTotal,
        m2_sii_eriazo: m2Eri,
        m2_sii_construido: m2Con,
        avaluo_eriazo: redondo(avEri),
        avaluo_construido: redondo(avCon),
        sobretasa:form.sobretasa,
        proyecto:form.proyecto||null, notas:form.notas||null
      };
      if(avMode) cambios.avaluo_vigente_desde = avDesde||null;
      try{
        await db.patch("terrenos","rol=eq."+encodeURIComponent(terreno.rol), cambios);
      }catch(e){
        if(histId){ try{ await db.del("avaluos_historial","id=eq."+histId); }catch(_){} }
        throw e;
      }
      if(avMode==="nuevo"){
        logAudit("actualizar_avaluo",`Actualizó el avalúo fiscal de "${nom}": ${fmtCLP(oldTotal)} → ${fmtCLP(newTotal)} (vigente desde ${fmtDate(avDesde)})`,proj);
      }else if(avMode==="corregir" && !mismoAvaluo){
        logAudit("corregir_avaluo",`Corrigió el avalúo fiscal de "${nom}": ${fmtCLP(oldTotal)} → ${fmtCLP(newTotal)} (sin historial)`,proj);
      }else{
        logAudit("editar_terreno",`Editó información del terreno "${nom}"`,proj);
      }
      onUpdated({...form, estado:estadoDe(form), vigente:estadoDe(form)==="Activo"?"SI":"NO", m2_sii:m2Total, avaluo:newTotal, m2_sii_eriazo:m2Eri, m2_sii_construido:m2Con,
        avaluo_eriazo:redondo(avEri), avaluo_construido:redondo(avCon),
        avaluo_vigente_desde: avMode ? (avDesde||null) : terreno.avaluo_vigente_desde});
      setEditing(false);
      setAvMode(null);
      if(avMode==="nuevo") setHistTick(x=>x+1);
    }catch(e){alert("Error: "+e.message);}
    setSaving(false);
  };

  const borrarHistAv = async (h) => {
    if(!confirm(`¿Eliminar del historial el avalúo de ${fmtCLP(h.avaluo)} (${periodoAv(h)})?\n\nHazlo solo si se registró por error. No se puede deshacer.`)) return;
    try{
      await db.del("avaluos_historial","id=eq."+h.id);
      const nom = form.terreno||terreno.terreno;
      logAudit("eliminar_avaluo_historial",`Eliminó del historial el avalúo de ${fmtCLP(h.avaluo)} (${periodoAv(h)}) de "${nom}"`,`${nom} · ${terreno.rol}`);
      setHistTick(x=>x+1);
    }catch(e){alert("Error: "+e.message);}
  };

  const Row = ({k,v}) => (
    <div className="info-row"><span className="info-key">{k}</span><span className="info-val">{v}</span></div>
  );
  const ExpandRow = ({k, v, expanded, onToggle, hasBreak, subRows=[], extra=null, title="Ver desglose"}) => (
    <>
      <div className="info-row" style={hasBreak?{cursor:"pointer"}:undefined} onClick={hasBreak?onToggle:undefined} title={hasBreak?title:undefined}>
        <span className="info-key">{k}{hasBreak && <span style={{marginLeft:6,fontSize:9,color:"var(--ink3)",display:"inline-block",transition:"transform 0.15s",transform:expanded?"rotate(90deg)":"rotate(0)"}}>▶</span>}</span>
        <span className="info-val">{v}</span>
      </div>
      {hasBreak && expanded && subRows.map(([subK,subV],i)=>(
        <div key={i} className="info-row" style={{background:"var(--bg)",paddingLeft:16}}>
          <span className="info-key" style={{fontSize:11.5}}>└ {subK}</span>
          <span className="info-val" style={{fontSize:12}}>{subV}</span>
        </div>
      ))}
      {hasBreak && expanded && extra}
    </>
  );

  // Detalle del avalúo al desplegar: desde cuándo rige, variación vs el anterior y avalúos anteriores.
  const subRowSt = {background:"var(--bg)",paddingLeft:16};
  const avActual = parseInt(terreno.avaluo)||0;
  const avPrevio = histAvOrd.length ? (parseInt(histAvOrd[0].avaluo)||0) : 0;
  const avVar = (avPrevio>0 && avActual>0) ? (avActual-avPrevio)/avPrevio*100 : null;
  const fmtVar = v => (v>0?"▲ ":v<0?"▼ ":"")+Math.abs(v).toLocaleString("es-CL",{maximumFractionDigits:1})+"%";
  const avVigenteDesde = terreno.avaluo_vigente_desde || (histAvOrd[0] && histAvOrd[0].vigente_hasta) || null;
  const avExpandible = hasAvBreak || histAvOrd.length>0 || !!avVigenteDesde;
  const avExtra = (
    <>
      {avVigenteDesde && (
        <div className="info-row" style={subRowSt}>
          <span className="info-key" style={{fontSize:11.5}}>└ Vigente desde</span>
          <span className="info-val" style={{fontSize:12}}>
            {fmtDate(avVigenteDesde)}
            {avVar!==null && <span style={{marginLeft:6,color:"var(--ink3)",fontWeight:400}}>({fmtVar(avVar)} vs anterior)</span>}
          </span>
        </div>
      )}
      {histAvOrd.length>0 && (
        <>
          <div className="info-row" style={{...subRowSt,paddingTop:10}}>
            <span className="info-key" style={{fontSize:10,textTransform:"uppercase",letterSpacing:1,fontWeight:600}}>Avalúos anteriores ({histAvOrd.length})</span>
            <span/>
          </div>
          {histAvOrd.map(h=>(
            <div key={h.id} className="info-row" style={subRowSt}>
              <span className="info-key" style={{fontSize:11.5}}>└ {periodoAv(h)}</span>
              <span className="info-val" style={{fontSize:12,color:"var(--ink2)"}}>{fmtCLP(h.avaluo)}</span>
            </div>
          ))}
        </>
      )}
    </>
  );

  // ── Resúmenes (solo lectura) para mostrar bajo las tarjetas ──
  const sumAnio = new Date().getFullYear();
  const cuotasAnio = [...cuotas].filter(c=>c.anio===sumAnio).sort((a,b)=>(a.numero||0)-(b.numero||0));
  const cuPaid = cuotasAnio.filter(c=>c.pagado).reduce((s,c)=>s+(parseInt(c.monto)||0),0);
  const cuTotal = cuotasAnio.reduce((s,c)=>s+(parseInt(c.monto)||0),0);
  const cuPending = cuTotal - cuPaid;
  const cuOverdue = cuotasAnio.filter(c=>!c.pagado && cuotaStatus(c)==="vencida").reduce((s,c)=>s+(parseInt(c.monto)||0),0);
  const devsSorted = [...devoluciones].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const devTotal = devoluciones.filter(devConcretada).reduce((s,d)=>s+(parseInt(d.monto)||0),0); // caja
  const devProceso = devoluciones.filter(d=>!devConcretada(d));
  const devProcesoTotal = devProceso.reduce((s,d)=>s+(parseInt(d.monto)||0),0);
  const bitaSorted = [...bitacora].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));

  return (
    <>
    <div className="info-grid">
      <div className="info-card">
        <h4>Datos del terreno</h4>
        {editing ? (
          <>
            <div className="field" style={{marginBottom:10}}>
              <label>Nombre</label>
              <input value={form.terreno} onChange={e=>set("terreno",e.target.value)}/>
            </div>
            <div className="field-row" style={{marginBottom:10}}>
              <div className="field"><label>Ciudad</label>
                <select value={form.ciudad} onChange={e=>set("ciudad",e.target.value)}>
                  {CIUDADES.map(c=><option key={c}>{c}</option>)}
                  {!CIUDADES.includes(form.ciudad)&&<option>{form.ciudad}</option>}
                </select>
              </div>
              <div className="field"><label>Estado</label>
                <select value={estadoDe(form)} onChange={e=>set("estado",e.target.value)}>
                  {ESTADOS.map(x=><option key={x}>{x}</option>)}
                </select>
              </div>
            </div>
            <div className="field" style={{marginBottom:10}}>
              <label>Proyecto asociado</label>
              <input value={form.proyecto||""} onChange={e=>set("proyecto",e.target.value)}/>
            </div>
            <div className="field" style={{marginBottom:12}}>
              <label>Notas</label>
              <textarea value={form.notas||""} onChange={e=>set("notas",e.target.value)} rows={3}/>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-primary btn-sm" onClick={save} disabled={saving}>{saving?"Guardando...":"Guardar"}</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>{setForm({...terreno});setEditing(false);setAvMode(null);}}>Cancelar</button>
            </div>
          </>
        ):(
          <>
            <Row k="ROL SII" v={<span style={{fontFamily:"monospace"}}>{terreno.rol}</span>}/>
            <Row k="Ciudad" v={terreno.ciudad}/>
            <Row k="Estado" v={<EstadoChip estado={estadoDe(terreno)}/>}/>
            {estadoDe(terreno)!=="Activo" && !oculto && (
              <div style={{fontSize:11.5,color:"var(--amber)",padding:"6px 0",lineHeight:1.4}}>
                Este terreno no está activo pero sigue sumando en los totales del dashboard. Si ya no corresponde, ocúltalo con 🙈 en la barra lateral.
              </div>
            )}
            <Row k="Proyecto" v={terreno.proyecto||"—"}/>
            {terreno.notas&&<div style={{padding:"8px 0"}}>
              <div className="info-key" style={{marginBottom:4}}>Notas</div>
              <div style={{fontSize:12.5,color:"var(--ink2)",lineHeight:1.6}}>{terreno.notas}</div>
            </div>}
            <button className="btn btn-outline btn-sm" style={{marginTop:14}} onClick={()=>{setAvMode(null);setEditing(true);}}>✏️ Editar información</button>
          </>
        )}
      </div>

      <div className="info-card">
        <h4>Datos SII</h4>
        {editing ? (
          <>
            <div className="field" style={{marginBottom:6}}>
              <label>M² SII {hasM2Break && <span style={{color:"var(--ink3)",fontSize:10,fontWeight:400}}>(suma del desglose)</span>}</label>
              <input type="text" inputMode="decimal"
                value={hasM2Break ? fmtCLInput(String(m2Total), true) : fmtCLInput(form.m2_sii, true)}
                onChange={e=>set("m2_sii", parseCLInput(e.target.value, true))}
                readOnly={hasM2Break}
                style={hasM2Break?{background:"var(--bg)",color:"var(--ink3)",cursor:"not-allowed"}:undefined}/>
            </div>
            <div className="field-row" style={{marginBottom:10}}>
              <div className="field"><label style={{fontSize:10.5,color:"var(--ink3)"}}>└ Sitio eriazo (m²)</label>
                <input type="text" inputMode="decimal"
                  value={form.m2_sii_eriazo===null||form.m2_sii_eriazo===undefined?"":fmtCLInput(String(form.m2_sii_eriazo), true)}
                  onChange={e=>set("m2_sii_eriazo", e.target.value===""?null:parseCLInput(e.target.value, true))}/>
              </div>
              <div className="field"><label style={{fontSize:10.5,color:"var(--ink3)"}}>└ Terreno construido (m²)</label>
                <input type="text" inputMode="decimal"
                  value={form.m2_sii_construido===null||form.m2_sii_construido===undefined?"":fmtCLInput(String(form.m2_sii_construido), true)}
                  onChange={e=>set("m2_sii_construido", e.target.value===""?null:parseCLInput(e.target.value, true))}/>
              </div>
            </div>

            <div className="field" style={{marginBottom:6}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <label>Avalúo fiscal ($CLP) {hasAvBreak && <span style={{color:"var(--ink3)",fontSize:10,fontWeight:400}}>(suma del desglose)</span>}</label>
                {avMode===null && (
                  <span style={{marginLeft:"auto",display:"flex",gap:6}}>
                    <button type="button" className="btn btn-primary btn-xs" onClick={()=>abrirAvMode("nuevo")} title="Reavalúo: el avalúo actual queda guardado en el historial">↻ Actualizar avalúo</button>
                    <button type="button" className="btn btn-ghost btn-xs" onClick={()=>abrirAvMode("corregir")} title="Para errores de tipeo: reemplaza el valor sin guardarlo en el historial">✎ Corregir</button>
                  </span>
                )}
              </div>
              <input type="text" inputMode="numeric"
                value={hasAvBreak ? fmtCLInput(String(Math.round(avTotal||0)), false) : fmtCLInput(form.avaluo, false)}
                onChange={e=>set("avaluo", parseCLInput(e.target.value, false))}
                readOnly={hasAvBreak || avMode===null}
                title={avMode===null?"Usa «Actualizar avalúo» o «Corregir» para cambiarlo":undefined}
                style={(hasAvBreak || avMode===null)?{background:"var(--bg)",color:"var(--ink3)",cursor:"not-allowed"}:undefined}/>
            </div>
            <div className="field-row" style={{marginBottom:10}}>
              <div className="field"><label style={{fontSize:10.5,color:"var(--ink3)"}}>└ Sitio eriazo ($CLP)</label>
                <input type="text" inputMode="numeric"
                  value={form.avaluo_eriazo===null||form.avaluo_eriazo===undefined?"":fmtCLInput(String(form.avaluo_eriazo), false)}
                  onChange={e=>set("avaluo_eriazo", e.target.value===""?null:parseCLInput(e.target.value, false))}
                  readOnly={avMode===null}
                  style={avMode===null?{background:"var(--bg)",color:"var(--ink3)",cursor:"not-allowed"}:undefined}/>
              </div>
              <div className="field"><label style={{fontSize:10.5,color:"var(--ink3)"}}>└ Terreno construido ($CLP)</label>
                <input type="text" inputMode="numeric"
                  value={form.avaluo_construido===null||form.avaluo_construido===undefined?"":fmtCLInput(String(form.avaluo_construido), false)}
                  onChange={e=>set("avaluo_construido", e.target.value===""?null:parseCLInput(e.target.value, false))}
                  readOnly={avMode===null}
                  style={avMode===null?{background:"var(--bg)",color:"var(--ink3)",cursor:"not-allowed"}:undefined}/>
              </div>
            </div>

            {avMode==="nuevo" && (
              <div style={{background:"var(--teal-lt)",border:"1px solid var(--teal)",borderRadius:6,padding:"8px 10px",marginBottom:10,fontSize:12,color:"var(--ink2)",lineHeight:1.5}}>
                <div style={{fontWeight:600,color:"var(--teal)",marginBottom:3}}>↻ Nuevo avalúo</div>
                <div style={{marginBottom:6}}>
                  {(parseInt(terreno.avaluo)||0)>0
                    ? <>El avalúo actual, <b>{fmtCLP(terreno.avaluo)}</b>{terreno.avaluo_vigente_desde?` (vigente desde ${fmtDate(terreno.avaluo_vigente_desde)})`:""}, quedará guardado en el historial. Ingresa arriba el nuevo valor.</>
                    : <>Este terreno no tiene avalúo registrado: el que ingreses quedará como el primero.</>}
                </div>
                <div style={{display:"flex",alignItems:"flex-end",gap:10,flexWrap:"wrap"}}>
                  <div className="field" style={{maxWidth:180}}><label>Vigente desde</label>
                    <input type="date" value={avDesde} onChange={e=>setAvDesde(e.target.value)}/>
                  </div>
                  <button type="button" className="btn btn-ghost btn-xs" onClick={cancelarAvMode}>Cancelar actualización</button>
                </div>
              </div>
            )}
            {avMode==="corregir" && (
              <div style={{background:"var(--amber-lt)",border:"1px solid var(--amber)",borderRadius:6,padding:"8px 10px",marginBottom:10,fontSize:12,color:"var(--ink2)",lineHeight:1.5}}>
                <div style={{fontWeight:600,color:"var(--amber)",marginBottom:3}}>✎ Corrección</div>
                <div style={{marginBottom:6}}>Reemplaza el valor actual <b>sin guardarlo en el historial</b>. Úsalo solo para errores de tipeo; para un reavalúo usa «Actualizar avalúo».</div>
                <div style={{display:"flex",alignItems:"flex-end",gap:10,flexWrap:"wrap"}}>
                  <div className="field" style={{maxWidth:180}}><label>Vigente desde (opcional)</label>
                    <input type="date" value={avDesde} onChange={e=>setAvDesde(e.target.value)}/>
                  </div>
                  <button type="button" className="btn btn-ghost btn-xs" onClick={cancelarAvMode}>Cancelar corrección</button>
                </div>
              </div>
            )}
            {avMode===null && histAvOrd.length>0 && (
              <div style={{marginBottom:10}}>
                <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:1.2,color:"var(--ink3)",fontWeight:600,marginBottom:4}}>Avalúos anteriores</div>
                {histAvOrd.map(h=>(
                  <div key={h.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,padding:"4px 0",borderBottom:"1px solid var(--line)"}}>
                    <span style={{color:"var(--ink3)",flex:1}}>{periodoAv(h)}</span>
                    <span style={{fontWeight:600}}>{fmtCLP(h.avaluo)}</span>
                    <button type="button" className="btn btn-danger btn-xs" onClick={()=>borrarHistAv(h)} title="Eliminar del historial (solo si se registró por error)">🗑</button>
                  </div>
                ))}
              </div>
            )}

            <div className="info-row" style={{background:"var(--teal-lt)",padding:"8px 10px",borderRadius:6,marginBottom:10}}>
              <span className="info-key">UF/m² (auto)</span>
              <span className="info-val" style={{fontWeight:600,color:"var(--teal)"}}>{fmtUF(ufm2Total)}</span>
            </div>

            <div className="field">
              <label>Sobretasa</label>
              <select value={form.sobretasa?"Si":"No"} onChange={e=>set("sobretasa",e.target.value==="Si")}>
                <option>No</option><option>Si</option>
              </select>
            </div>
          </>
        ):(
          <>
            <ExpandRow
              k="Superficie (M² SII)"
              v={fmtM2(m2Total)}
              expanded={expandM2}
              onToggle={()=>setExpandM2(x=>!x)}
              hasBreak={hasM2Break}
              subRows={[
                ["Sitio eriazo", m2Eri!==null ? fmtM2(m2Eri) : "—"],
                ["Terreno construido", m2Con!==null ? fmtM2(m2Con) : "—"]
              ]}
            />
            <ExpandRow
              k="Avalúo fiscal"
              v={<>{fmtCLP(avTotal)}{avTotalUF && <span style={{marginLeft:6,color:"var(--ink3)",fontWeight:400}}>({avTotalUF})</span>}</>}
              expanded={expandAv}
              onToggle={()=>setExpandAv(x=>!x)}
              hasBreak={avExpandible}
              title="Ver desglose e historial"
              subRows={hasAvBreak ? [
                ["Sitio eriazo", avEri!==null ? fmtCLP(avEri) : "—"],
                ["Terreno construido", avCon!==null ? fmtCLP(avCon) : "—"]
              ] : []}
              extra={avExtra}
            />
            <ExpandRow
              k="UF por m²"
              v={fmtUF(ufm2Total)}
              expanded={expandUf}
              onToggle={()=>setExpandUf(x=>!x)}
              hasBreak={hasUfBreak}
              subRows={[
                ["Sitio eriazo", fmtUF(ufm2Eri)],
                ["Terreno construido", fmtUF(ufm2Con)]
              ]}
            />
            <div className="info-row">
              <span className="info-key">Sobretasa</span>
              <span className={`badge-chip ${terreno.sobretasa?"chip-si":"chip-no"}`}>
                {terreno.sobretasa?"Sí aplica":"No aplica"}
              </span>
            </div>
          </>
        )}
      </div>
    </div>

    {/* ── Resumen de Contribuciones / Devoluciones / Bitácora (solo lectura) ── */}
    <div className="info-summary-grid">
      {/* Contribuciones */}
      <div className="info-card">
        <h4>💰 Contribuciones {sumAnio}</h4>
        {cuotasAnio.length===0 ? (
          <div className="isum-empty">Sin cuotas registradas para {sumAnio}.</div>
        ) : (
          <>
            {cuotasAnio.map(c=>{
              const st = cuotaStatus(c);
              const stTxt = st==="pagada"?"✓ Pagada":st==="vencida"?"⚠ Vencida":st==="proxima"?"⏰ Próxima":"Pendiente";
              return (
                <div key={c.id} className="isum-line">
                  <span style={{color:"var(--ink2)"}}>{cuotaDisplayLabel(c)}</span>
                  <span style={{display:"flex",alignItems:"center",gap:8}}>
                    <span className={`cuota-status-chip st-${st}`}>{stTxt}</span>
                    <span style={{fontWeight:600,minWidth:78,textAlign:"right"}}>{fmtCLP(c.monto)}</span>
                  </span>
                </div>
              );
            })}
            <div className="isum-totals">
              <div className="isum-tot"><span className="isum-tot-lbl">Total {sumAnio}</span><span className="isum-tot-val">{fmtCLP(cuTotal)}</span></div>
              <div className="isum-tot"><span className="isum-tot-lbl">Pagado</span><span className="isum-tot-val" style={{color:"var(--green)"}}>{fmtCLP(cuPaid)}</span></div>
              <div className="isum-tot"><span className="isum-tot-lbl">Por pagar</span><span className="isum-tot-val">{fmtCLP(cuPending)}</span></div>
              {cuOverdue>0 && <div className="isum-tot"><span className="isum-tot-lbl">Vencido</span><span className="isum-tot-val" style={{color:"var(--red)"}}>{fmtCLP(cuOverdue)}</span></div>}
            </div>
          </>
        )}
      </div>

      {/* Devoluciones */}
      <div className="info-card">
        <h4>↩️ Devoluciones</h4>
        {devsSorted.length===0 ? (
          <div className="isum-empty">Sin devoluciones registradas.</div>
        ) : (
          <>
            {devsSorted.slice(0,4).map(d=>{
              const ok = devConcretada(d);
              return (
                <div key={d.id} className="isum-line">
                  <span style={{color:"var(--ink2)",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    <span style={{color:"var(--ink3)",fontSize:11}}>{fmtDate(d.fecha)}</span>{d.motivo?" · "+d.motivo:""}
                  </span>
                  <span style={{display:"flex",alignItems:"center",gap:8}}>
                    {!ok && <span className="cuota-status-chip st-proxima" style={{marginBottom:0}}>⏳ En proceso</span>}
                    <span style={{fontWeight:600,color:ok?"var(--red)":"var(--ink3)",minWidth:78,textAlign:"right"}}>−{fmtCLP(d.monto)}</span>
                  </span>
                </div>
              );
            })}
            <div className="isum-totals" style={{gridTemplateColumns:"1fr"}}>
              <div className="isum-tot"><span className="isum-tot-lbl">Total concretado (caja) {devsSorted.length>4?`(${devsSorted.length} registros)`:""}</span><span className="isum-tot-val" style={{color:"var(--red)"}}>−{fmtCLP(devTotal)}</span></div>
              {devProceso.length>0 && <div className="isum-tot"><span className="isum-tot-lbl">En proceso ({devProceso.length}) · aún no en caja</span><span className="isum-tot-val" style={{color:"var(--amber)"}}>−{fmtCLP(devProcesoTotal)}</span></div>}
            </div>
            {devsSorted.length>4 && <div style={{fontSize:10.5,color:"var(--ink3)",marginTop:8,fontStyle:"italic"}}>Mostrando las 4 más recientes · ver todas en la pestaña Devoluciones</div>}
          </>
        )}
      </div>

      {/* Bitácora */}
      <div className="info-card">
        <h4>📓 Bitácora</h4>
        {bitaSorted.length===0 ? (
          <div className="isum-empty">Sin entradas en la bitácora.</div>
        ) : (
          bitaSorted.map(b=>(
            <div key={b.id} className="isum-line" style={{alignItems:"flex-start"}}>
              <span style={{color:"var(--ink2)",minWidth:0,flex:1}}>
                <span style={{color:"var(--ink3)",fontSize:11}}>{fmtDate(b.fecha)}</span>
                <span style={{marginLeft:6}}>{b.detalle}</span>
              </span>
              <span style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                {b.prioridad && <span className={`prio-chip prio-${b.prioridad.toLowerCase()}`}>{b.prioridad}</span>}
                <span className={`estatus-chip est-${b.estatus==="En Proceso"?"proceso":(b.estatus||"").toLowerCase()}`}>{b.estatus}</span>
              </span>
            </div>
          ))
        )}
      </div>
    </div>
    </>
  );
}

// CUOTAS TAB
// ─────────────────────────────────────────────────────
function CuotasTab({terreno, cuotas, onRefresh}) {
  const [anio, setAnio] = useState(new Date().getFullYear());
  const [saving, setSaving] = useState({});
  const [payDates, setPayDates] = useState({});
  const [genBusy, setGenBusy] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const [addForm, setAddForm] = useState({anio:new Date().getFullYear(), numero:"1", nombre:"", monto:"", fecha_vencimiento:"", pagado:false, fecha_pago:""});
  const [addBusy, setAddBusy] = useState(false);
  const [editingVenc, setEditingVenc] = useState({});

  const current = cuotas.filter(c=>c.anio===anio);
  const anioRef = useRef(anio);
  useEffect(()=>{anioRef.current=anio;},[anio]);

  const _proj = `${terreno.terreno||terreno.rol} · ${terreno.rol}`;

  const genCuotas = async () => {
    setGenBusy(true);
    const baseMonto = parseInt(terreno._cuota_monto)||0;
    const baseTasa  = parseFloat(terreno._tasa)||0;
    const rows = [1,2,3,4].map(n=>({
      terreno_rol:terreno.rol, anio, numero:n,
      monto:baseMonto, tasa:baseTasa,
      fecha_vencimiento:`${anio}-${CUOTA_DATES[n]}`, pagado:false
    }));
    try{
      await db.upsert("cuotas", rows);
      logAudit("generar_cuotas",`Generó las 4 cuotas de ${anio} en "${terreno.terreno||terreno.rol}"`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
    setGenBusy(false);
  };

  const markPaid = async (c, paid) => {
    setSaving(s=>({...s,[c.id]:true}));
    try{
      await db.patch("cuotas","id=eq."+c.id, {pagado:paid, fecha_pago:paid?(payDates[c.id]||today()):null});
      logAudit(paid?"marcar_cuota_pagada":"marcar_cuota_impaga",`${paid?"Marcó como pagada":"Marcó como impaga"} la ${cuotaDisplayLabel(c)} de ${c.anio} en "${terreno.terreno||terreno.rol}"`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
    setSaving(s=>({...s,[c.id]:false}));
  };

  const updateMonto = async (c, monto) => {
    try{
      await db.patch("cuotas","id=eq."+c.id, {monto:parseInt(monto)||0});
      logAudit("editar_monto_cuota",`Editó monto de ${cuotaDisplayLabel(c)} ${c.anio} en "${terreno.terreno||terreno.rol}" a ${fmtCLP(parseInt(monto)||0)}`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  const updateVenc = async (c, fecha) => {
    if(!fecha || fecha===c.fecha_vencimiento) return;
    try{
      await db.patch("cuotas","id=eq."+c.id, {fecha_vencimiento:fecha});
      logAudit("editar_fecha_venc",`Editó fecha de vencimiento de ${cuotaDisplayLabel(c)} ${c.anio} en "${terreno.terreno||terreno.rol}" → ${fmtDate(fecha)}`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  const updateFechaPago = async (c, fecha) => {
    if(fecha===c.fecha_pago) return;
    try{
      await db.patch("cuotas","id=eq."+c.id, {fecha_pago:fecha||null});
      logAudit("editar_fecha_pago",`Editó fecha de pago de ${cuotaDisplayLabel(c)} ${c.anio} en "${terreno.terreno||terreno.rol}" → ${fecha?fmtDate(fecha):"sin fecha"}`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  const deleteCuota = async (c) => {
    const lbl = cuotaDisplayLabel(c);
    if(!confirm(`¿Eliminar "${lbl}" de ${c.anio}?`)) return;
    try{
      await db.del("cuotas","id=eq."+c.id);
      logAudit("eliminar_cuota",`Eliminó ${lbl} de ${c.anio} en "${terreno.terreno||terreno.rol}"`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  const updateNombre = async (c, nombre) => {
    const clean = (nombre||"").trim();
    const final = clean || null; // vacío → vuelve al nombre por defecto
    if((c.nombre||null) === final) return;
    try{
      await db.patch("cuotas","id=eq."+c.id, {nombre: final});
      logAudit("editar_nombre_cuota",`Renombró cuota de ${c.anio} en "${terreno.terreno||terreno.rol}" → "${final||cuotaDefaultLabel(c)}"`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  const addManual = async () => {
    if(!addForm.fecha_vencimiento){alert("Debes elegir la fecha de vencimiento");return;}
    const targetAnio = anio; // siempre fijo al año visto
    const maxN = cuotas.filter(c=>c.anio===targetAnio).reduce((m,c)=>Math.max(m,c.numero||0),4);
    const finalNumero = maxN + 1; // extras siempre >= 5
    setAddBusy(true);
    try{
      await db.insert("cuotas",[{
        terreno_rol:terreno.rol, anio:targetAnio, numero:finalNumero,
        nombre:(addForm.nombre||"").trim()||null,
        monto:parseInt(addForm.monto)||0, tasa:0,
        fecha_vencimiento:addForm.fecha_vencimiento,
        pagado:addForm.pagado,
        fecha_pago:addForm.pagado?(addForm.fecha_pago||today()):null
      }]);
      logAudit("agregar_cuota_extra",`Agregó cuota extra${(addForm.nombre||"").trim()?` "${addForm.nombre.trim()}"`:""} de ${fmtCLP(parseInt(addForm.monto)||0)} en "${terreno.terreno||terreno.rol}" (vence ${fmtDate(addForm.fecha_vencimiento)})`,_proj);
      setShowAdd(false);
      setAddForm({anio:anio, numero:"extra", nombre:"", monto:"", fecha_vencimiento:"", pagado:false, fecha_pago:""});
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
    setAddBusy(false);
  };

  const paid    = current.filter(c=>c.pagado).reduce((s,c)=>s+(parseInt(c.monto)||0), 0);
  const pending = current.filter(c=>!c.pagado).reduce((s,c)=>s+(parseInt(c.monto)||0), 0);
  const overdue = current.filter(c=>!c.pagado&&cuotaStatus(c)==="vencida").reduce((s,c)=>s+(parseInt(c.monto)||0), 0);
  const total   = current.reduce((s,c)=>s+(parseInt(c.monto)||0), 0);

  return (
    <>
      <div className="cuotas-header">
        <div className="anio-nav">
          <button onClick={()=>setAnio(a=>a-1)}>◀</button>
          <div className="anio-display">{anio}</div>
          <button onClick={()=>setAnio(a=>a+1)}>▶</button>
        </div>
        <div style={{display:"flex",gap:8}}>
          {current.length===0&&(
            <button className="btn btn-primary btn-sm" onClick={genCuotas} disabled={genBusy}>
              {genBusy?"Generando...":"✦ Generar cuotas "+anio}
            </button>
          )}
          <button className="btn btn-outline btn-sm" onClick={()=>{setAddForm(f=>({...f,anio})); setShowAdd(s=>!s);}}>
            {showAdd?"✕ Cancelar":"➕ Agregar cuota extra"}
          </button>
        </div>
      </div>

      {showAdd&&(
        <div className="add-entry-box">
          <div className="title">Agregar cuota extra — {anio}</div>
          <div className="field" style={{marginBottom:10}}>
            <label>Nombre (opcional)</label>
            <input type="text" value={addForm.nombre||""} onChange={e=>setAddForm(f=>({...f,nombre:e.target.value}))}
              placeholder={'Si lo dejas vacío queda "Extra — {Mes}"'}/>
          </div>
          <div className="field-row" style={{marginBottom:10}}>
            <div className="field"><label>Monto ($CLP)</label>
              <input type="text" inputMode="numeric"
                value={addForm.monto?parseInt(String(addForm.monto).replace(/[^\d]/g,"")||"0").toLocaleString("es-CL"):""}
                onChange={e=>setAddForm(f=>({...f,monto:e.target.value.replace(/[^\d]/g,"")}))}
                placeholder="0"/>
            </div>
            <div className="field"><label>Fecha de vencimiento</label>
              <input type="date" value={addForm.fecha_vencimiento} onChange={e=>setAddForm(f=>({...f,fecha_vencimiento:e.target.value}))}/>
            </div>
          </div>
          <div className="field-row" style={{marginBottom:12}}>
            <div className="field">
              <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                <input type="checkbox" checked={addForm.pagado} onChange={e=>setAddForm(f=>({...f,pagado:e.target.checked}))} style={{width:"auto"}}/>
                Ya está pagada
              </label>
            </div>
            {addForm.pagado&&(
              <div className="field"><label>Fecha de pago</label>
                <input type="date" value={addForm.fecha_pago} onChange={e=>setAddForm(f=>({...f,fecha_pago:e.target.value}))}/>
              </div>
            )}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-primary btn-sm" onClick={addManual} disabled={addBusy}>{addBusy?"Guardando...":"Guardar cuota extra"}</button>
          </div>
        </div>
      )}

      {current.length===0 ? (
        <div style={{textAlign:"center",padding:"50px 20px",color:"var(--ink3)"}}>
          <div style={{fontSize:38,marginBottom:14}}>📋</div>
          <p style={{marginBottom:6}}>No hay cuotas registradas para <strong>{anio}</strong>.</p>
          <p style={{fontSize:12}}>Haz clic en "Generar cuotas {anio}" para crear las 4 cuotas con las fechas estándar.</p>
        </div>
      ):(
        <>
          <div className="cuotas-grid">
            {[1,2,3,4].map(n=>{
              const c = current.find(x=>x.numero===n);
              if(!c) return (
                <div key={`vacia-${anio}-${n}`} className="cuota-card" style={{opacity:0.45}}>
                  <div className="cuota-num">{CUOTA_SHORT[n]} Cuota</div>
                  <div style={{fontSize:12,color:"var(--ink3)"}}>No generada</div>
                </div>
              );
              const st = cuotaStatus(c);
              // key por id de cuota (no por posición): fuerza a React a recrear los
              // campos de fecha al cambiar de terreno o de año. Con key={n} el input
              // conservaba la fecha de la cuota anterior y podía guardarla en esta.
              return (
                <div key={c.id} className={`cuota-card ${st}`}>
                  <CuotaTitleInput cuota={c} onSave={v=>updateNombre(c,v)}/>
                  <span className={`cuota-status-chip st-${st}`}>
                    {st==="pagada"?"✓ Pagada":st==="vencida"?"⚠ Vencida":st==="proxima"?"⏰ Próxima":"Pendiente"}
                  </span>
                  <div>
                    <MontoInput value={c.monto} onSave={v=>updateMonto(c,v)}/>
                  </div>
                  <div className="cuota-fecha">
                    <label style={{fontSize:10.5,color:"var(--ink3)",display:"block",marginBottom:2}}>Vence</label>
                    <input type="date" defaultValue={c.fecha_vencimiento||""}
                      onBlur={e=>updateVenc(c, e.target.value)}
                      style={{fontSize:11.5,padding:"3px 6px",border:"1px solid var(--line)",borderRadius:4,background:"var(--white)",width:"100%"}}/>
                    {c.pagado&&(
                      <>
                        <label style={{fontSize:10.5,color:"var(--ink3)",display:"block",marginTop:6,marginBottom:2}}>Fecha de pago</label>
                        <input type="date" defaultValue={c.fecha_pago||""}
                          onBlur={e=>updateFechaPago(c, e.target.value)}
                          style={{fontSize:11.5,padding:"3px 6px",border:"1px solid var(--line)",borderRadius:4,background:"var(--white)",width:"100%"}}/>
                      </>
                    )}
                  </div>
                  <div className="cuota-divider"/>
                  <div className="cuota-actions">
                    {!c.pagado&&(
                      <>
                        <label style={{fontSize:10.5,color:"var(--ink3)",display:"block",marginBottom:2}}>Fecha de pago</label>
                        <input type="date" value={payDates[c.id]||today()}
                          onChange={e=>setPayDates(d=>({...d,[c.id]:e.target.value}))}/>
                      </>
                    )}
                    <button className={`btn btn-sm ${c.pagado?"btn-outline btn-success":"btn-primary"}`}
                      style={{width:"100%",justifyContent:"center"}}
                      disabled={saving[c.id]}
                      onClick={()=>markPaid(c,!c.pagado)}>
                      {saving[c.id]?"...":(c.pagado?"✕ Marcar impaga":"✓ Marcar pagada")}
                    </button>
                    <button className="btn btn-danger btn-xs" style={{width:"100%",justifyContent:"center"}} onClick={()=>deleteCuota(c)}>🗑 Eliminar</button>
                  </div>
                </div>
              );
            })}
          </div>

          {current.filter(c=>c.numero>4).length>0 && (
            <div style={{marginTop:24}}>
              <h4 style={{fontSize:13,fontWeight:600,color:"var(--ink2)",marginBottom:12,display:"flex",alignItems:"center",gap:7,fontFamily:"'IBM Plex Sans',sans-serif"}}>➕ Cuotas extras</h4>
              <div className="cuotas-grid">
                {current.filter(c=>c.numero>4).sort((a,b)=>(a.fecha_vencimiento||"").localeCompare(b.fecha_vencimiento||"")).map(c=>{
                  const st = cuotaStatus(c);
                  return (
                    <div key={c.id} className={`cuota-card ${st}`}>
                      <CuotaTitleInput cuota={c} onSave={v=>updateNombre(c,v)}/>
                      <span className={`cuota-status-chip st-${st}`}>
                        {st==="pagada"?"✓ Pagada":st==="vencida"?"⚠ Vencida":st==="proxima"?"⏰ Próxima":"Pendiente"}
                      </span>
                      <div><MontoInput value={c.monto} onSave={v=>updateMonto(c,v)}/></div>
                      <div className="cuota-fecha">
                        <label style={{fontSize:10.5,color:"var(--ink3)",display:"block",marginBottom:2}}>Vence</label>
                        <input type="date" defaultValue={c.fecha_vencimiento||""}
                          onBlur={e=>updateVenc(c, e.target.value)}
                          style={{fontSize:11.5,padding:"3px 6px",border:"1px solid var(--line)",borderRadius:4,background:"var(--white)",width:"100%"}}/>
                        {c.pagado&&(
                          <>
                            <label style={{fontSize:10.5,color:"var(--ink3)",display:"block",marginTop:6,marginBottom:2}}>Fecha de pago</label>
                            <input type="date" defaultValue={c.fecha_pago||""}
                              onBlur={e=>updateFechaPago(c, e.target.value)}
                              style={{fontSize:11.5,padding:"3px 6px",border:"1px solid var(--line)",borderRadius:4,background:"var(--white)",width:"100%"}}/>
                          </>
                        )}
                      </div>
                      <div className="cuota-divider"/>
                      <div className="cuota-actions">
                        {!c.pagado&&(
                          <>
                            <label style={{fontSize:10.5,color:"var(--ink3)",display:"block",marginBottom:2}}>Fecha de pago</label>
                            <input type="date" value={payDates[c.id]||today()}
                              onChange={e=>setPayDates(d=>({...d,[c.id]:e.target.value}))}/>
                          </>
                        )}
                        <button className={`btn btn-sm ${c.pagado?"btn-outline btn-success":"btn-primary"}`}
                          style={{width:"100%",justifyContent:"center"}}
                          disabled={saving[c.id]}
                          onClick={()=>markPaid(c,!c.pagado)}>
                          {saving[c.id]?"...":(c.pagado?"✕ Marcar impaga":"✓ Marcar pagada")}
                        </button>
                        <button className="btn btn-danger btn-xs" style={{width:"100%",justifyContent:"center"}} onClick={()=>deleteCuota(c)}>🗑 Eliminar</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <div className="cuotas-summary">
            <div className="sum-item"><div className="sum-label">Total {anio}</div><div className="sum-val">{fmtCLP(total)}</div></div>
            <div className="sum-item"><div className="sum-label">Pagado</div><div className="sum-val green">{fmtCLP(paid)}</div></div>
            <div className="sum-item"><div className="sum-label">Por pagar</div><div className="sum-val">{fmtCLP(pending)}</div></div>
            {overdue>0&&<div className="sum-item"><div className="sum-label">Vencido</div><div className="sum-val red">{fmtCLP(overdue)}</div></div>}
          </div>
        </>
      )}
    </>
  );
}

// Título editable de la cuota: muestra el nombre personalizado o el default.
// Vacío al guardar → vuelve al nombre por defecto.
function CuotaTitleInput({cuota, onSave}) {
  const [v, setV] = useState(cuota.nombre||"");
  useEffect(()=>setV(cuota.nombre||""),[cuota.id, cuota.nombre]);
  return (
    <input type="text" className="cuota-title-input" value={v}
      placeholder={cuotaDefaultLabel(cuota)}
      title="Haz clic para renombrar esta cuota"
      onChange={e=>setV(e.target.value)}
      onKeyDown={e=>{ if(e.key==="Enter") e.target.blur(); }}
      onBlur={()=>{ if((v||"").trim() !== (cuota.nombre||"")) onSave(v); }}/>
  );
}

function MontoInput({value, onSave}) {
  const fmtMonto = (n) => {
    if(n===""||n==null) return "";
    const num = String(n).replace(/[^\d]/g,"");
    return num ? parseInt(num).toLocaleString("es-CL") : "";
  };
  const [v, setV] = useState(fmtMonto(value));
  useEffect(()=>setV(fmtMonto(value)),[value]);
  return (
    <input type="text" inputMode="numeric" className="cuota-monto-input" value={v}
      onChange={e=>{
        const raw = e.target.value.replace(/[^\d]/g,"");
        setV(raw ? parseInt(raw).toLocaleString("es-CL") : "");
      }}
      onBlur={()=>{
        const raw = v.replace(/[^\d]/g,"");
        if(String(raw)!==String(value||"")) onSave(raw);
      }}/>
  );
}

// ─────────────────────────────────────────────────────
// DEVOLUCIONES TAB
// ─────────────────────────────────────────────────────
function DevolucionesTab({terreno, devoluciones, cuotas, onRefresh}) {
  // Una devolución puede registrarse apenas se inicia el trámite ("en proceso") y marcarse
  // como concretada cuando la plata entra. Solo las concretadas suman a caja y al neto.
  const nuevoForm = () => ({fecha:today(), monto:"", motivo:"", notas:"", concretada:false, fecha_concretada:today()});
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState(nuevoForm);
  const [addBusy, setAddBusy] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});
  // Devolución que se está marcando como concretada (mini formulario: monto final + fecha)
  const [concId, setConcId] = useState(null);
  const [concForm, setConcForm] = useState({monto:"", fecha_concretada:today()});
  const [concBusy, setConcBusy] = useState(false);

  const sorted = [...devoluciones].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const totalDev = sorted.filter(devConcretada).reduce((s,d)=>s+(parseInt(d.monto)||0),0); // caja
  const enProceso = sorted.filter(d=>!devConcretada(d));
  const totalProceso = enProceso.reduce((s,d)=>s+(parseInt(d.monto)||0),0);
  const totalContrib = cuotas.reduce((s,c)=>s+(parseInt(c.monto)||0),0);
  const neto = totalContrib - totalDev;

  const _proj = `${terreno.terreno||terreno.rol} · ${terreno.rol}`;
  const _nom = terreno.terreno||terreno.rol;

  const add = async () => {
    if(!form.fecha){alert("Debes elegir la fecha de inicio");return;}
    if(!form.monto||parseInt(form.monto)<=0){alert("Ingresa un monto válido");return;}
    if(form.concretada){
      if(!form.fecha_concretada){alert("Indica la fecha en que se concretó");return;}
      if(form.fecha_concretada<form.fecha){alert("La fecha de concreción no puede ser anterior a la fecha de inicio");return;}
    }
    setAddBusy(true);
    try{
      await db.insert("devoluciones",[{
        terreno_rol:terreno.rol, fecha:form.fecha,
        monto:parseInt(form.monto)||0,
        motivo:form.motivo.trim()||null, notas:form.notas.trim()||null,
        concretada:!!form.concretada,
        fecha_concretada:form.concretada?form.fecha_concretada:null
      }]);
      logAudit("nueva_devolucion",`Nueva devolución ${form.concretada?"concretada":"en proceso"} de ${fmtCLP(parseInt(form.monto)||0)} en "${_nom}"${form.motivo.trim()?` — ${form.motivo.trim()}`:""}`,_proj);
      setForm(nuevoForm());
      setShowAdd(false);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
    setAddBusy(false);
  };

  const abrirConcretar = (d) => {
    setEditingId(null);
    setConcId(d.id);
    setConcForm({monto:String(parseInt(d.monto)||""), fecha_concretada:today()});
  };

  const concretar = async (d) => {
    const monto = parseInt(concForm.monto)||0;
    if(monto<=0){alert("Ingresa un monto válido");return;}
    if(!concForm.fecha_concretada){alert("Indica la fecha en que se concretó");return;}
    if(concForm.fecha_concretada<d.fecha){alert("La fecha de concreción no puede ser anterior a la fecha de inicio ("+fmtDate(d.fecha)+")");return;}
    setConcBusy(true);
    try{
      await db.patch("devoluciones","id=eq."+d.id, {concretada:true, fecha_concretada:concForm.fecha_concretada, monto});
      const antes = parseInt(d.monto)||0;
      logAudit("concretar_devolucion",`Marcó como concretada la devolución de ${fmtCLP(monto)} en "${_nom}"${monto!==antes?` (monto ajustado desde ${fmtCLP(antes)})`:""}`,_proj);
      setConcId(null);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
    setConcBusy(false);
  };

  const abrirEditar = (d) => {
    setConcId(null);
    setEditingId(d.id);
    setEditForm({...d, concretada:devConcretada(d), fecha_concretada:d.fecha_concretada||(devConcretada(d)?d.fecha:today())});
  };

  const saveEdit = async (d) => {
    if(!editForm.fecha){alert("Debes elegir la fecha de inicio");return;}
    if(editForm.concretada){
      if(!editForm.fecha_concretada){alert("Indica la fecha en que se concretó");return;}
      if(editForm.fecha_concretada<editForm.fecha){alert("La fecha de concreción no puede ser anterior a la fecha de inicio");return;}
    }
    try{
      await db.patch("devoluciones","id=eq."+d.id, {
        fecha:editForm.fecha,
        monto:parseInt(editForm.monto)||0,
        motivo:editForm.motivo?.trim()||null,
        notas:editForm.notas?.trim()||null,
        concretada:!!editForm.concretada,
        fecha_concretada:editForm.concretada?editForm.fecha_concretada:null
      });
      logAudit("editar_devolucion",`Editó devolución (${fmtCLP(parseInt(editForm.monto)||0)}${editForm.concretada?"":", en proceso"}) en "${_nom}"`,_proj);
      setEditingId(null);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  const del = async (d) => {
    if(!confirm("¿Eliminar esta devolución?")) return;
    try{
      await db.del("devoluciones","id=eq."+d.id);
      logAudit("eliminar_devolucion",`Eliminó devolución de ${fmtCLP(parseInt(d.monto)||0)} en "${_nom}"`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  // Etiqueta para las casillas de verificación (la de .field label es en mayúsculas chicas)
  const chkLbl = {display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:12.5,color:"var(--ink2)",fontWeight:500,textTransform:"none",letterSpacing:0};
  const chkBox = {width:"auto",padding:0,margin:0,cursor:"pointer"};
  const cols = "100px 120px 150px 1fr 205px";

  return (
    <>
      <div className="bitacora-add-bar">
        <span style={{fontSize:13,color:"var(--ink3)"}}>
          {sorted.length} {sorted.length===1?"devolución":"devoluciones"}
          {enProceso.length>0 && <> · <b style={{color:"var(--amber)"}}>{enProceso.length} en proceso</b></>}
        </span>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(s=>!s)}>
          {showAdd?"✕ Cancelar":"+ Nueva devolución"}
        </button>
      </div>

      {showAdd&&(
        <div className="add-entry-box">
          <div className="title">Nueva devolución</div>
          <div className="field-row" style={{marginBottom:10}}>
            <div className="field"><label>Fecha de inicio</label>
              <input type="date" value={form.fecha} onChange={e=>setForm(f=>({...f,fecha:e.target.value}))}/>
            </div>
            <div className="field"><label>Monto ($CLP)</label>
              <input type="number" value={form.monto} onChange={e=>setForm(f=>({...f,monto:e.target.value}))} placeholder="0"/>
            </div>
          </div>
          <div className="field" style={{marginBottom:10}}>
            <label style={chkLbl}>
              <input type="checkbox" style={chkBox} checked={form.concretada}
                onChange={e=>{const v=e.target.checked; setForm(f=>({...f,concretada:v,fecha_concretada:v?f.fecha:f.fecha_concretada}));}}/>
              Ya se concretó (la plata ya entró)
            </label>
            {form.concretada ? (
              <div className="field" style={{marginTop:6,maxWidth:220}}><label>Fecha de concreción</label>
                <input type="date" value={form.fecha_concretada} onChange={e=>setForm(f=>({...f,fecha_concretada:e.target.value}))}/>
              </div>
            ) : (
              <div style={{fontSize:11.5,color:"var(--ink3)",marginTop:4}}>
                Quedará <b style={{color:"var(--amber)"}}>en proceso</b>: se ve como potencial y no suma a caja hasta que la marques como concretada.
              </div>
            )}
          </div>
          <div className="field" style={{marginBottom:10}}>
            <label>Motivo</label>
            <input value={form.motivo} onChange={e=>setForm(f=>({...f,motivo:e.target.value}))} placeholder="Ej: Ajuste por avalúo, recálculo SII, etc."/>
          </div>
          <div className="field" style={{marginBottom:12}}>
            <label>Notas</label>
            <textarea value={form.notas} onChange={e=>setForm(f=>({...f,notas:e.target.value}))} rows={2}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-primary btn-sm" onClick={add} disabled={addBusy}>{addBusy?"Guardando...":"Guardar devolución"}</button>
          </div>
        </div>
      )}

      <div className="cuotas-summary" style={{marginBottom:16}}>
        <div className="sum-item"><div className="sum-label">Total contribuciones</div><div className="sum-val">{fmtCLP(totalContrib)}</div></div>
        <div className="sum-item"><div className="sum-label">Devoluciones concretadas (caja)</div><div className="sum-val red">{fmtCLP(totalDev)}</div></div>
        <div className="sum-item"><div className="sum-label">En proceso (potencial)</div><div className="sum-val amber">{fmtCLP(totalProceso)}</div></div>
        <div className="sum-item"><div className="sum-label">Neto (contrib. − dev. caja)</div>
          <div className="sum-val" style={{color:neto>=0?"var(--green)":"var(--red)"}}>{fmtCLP(neto)}</div>
        </div>
      </div>

      {sorted.length===0 ? (
        <div style={{textAlign:"center",padding:"50px 20px",color:"var(--ink3)"}}>
          <div style={{fontSize:38,marginBottom:14}}>↩️</div>
          <p>Sin devoluciones registradas para este terreno.</p>
        </div>
      ):(
        <div className="data-table">
          <div className="dt-head" style={{gridTemplateColumns:cols,columnGap:"16px"}}>
            <span>Inicio</span><span style={{textAlign:"right"}}>Monto</span><span>Estado</span><span>Motivo / Notas</span><span style={{textAlign:"right"}}>Acciones</span>
          </div>
          {sorted.map(d=>{
            const ok = devConcretada(d);
            if(editingId===d.id) return (
              <div key={d.id} className="dt-row" style={{gridTemplateColumns:cols,columnGap:"16px",alignItems:"start",padding:"10px 12px"}}>
                <input type="date" value={editForm.fecha||""} onChange={e=>setEditForm(f=>({...f,fecha:e.target.value}))} title="Fecha de inicio"/>
                <input type="number" value={editForm.monto||""} onChange={e=>setEditForm(f=>({...f,monto:e.target.value}))} style={{textAlign:"right"}}/>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  <label style={chkLbl}>
                    <input type="checkbox" style={chkBox} checked={!!editForm.concretada}
                      onChange={e=>{const v=e.target.checked; setEditForm(f=>({...f,concretada:v,fecha_concretada:v?(f.fecha_concretada||today()):f.fecha_concretada}));}}/>
                    Concretada
                  </label>
                  {editForm.concretada && <input type="date" value={editForm.fecha_concretada||""} onChange={e=>setEditForm(f=>({...f,fecha_concretada:e.target.value}))} title="Fecha de concreción"/>}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  <input value={editForm.motivo||""} onChange={e=>setEditForm(f=>({...f,motivo:e.target.value}))} placeholder="Motivo"/>
                  <textarea value={editForm.notas||""} onChange={e=>setEditForm(f=>({...f,notas:e.target.value}))} rows={2} placeholder="Notas"/>
                </div>
                <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                  <button className="btn btn-primary btn-xs" onClick={()=>saveEdit(d)}>Guardar</button>
                  <button className="btn btn-ghost btn-xs" onClick={()=>setEditingId(null)}>Cancelar</button>
                </div>
              </div>
            );
            return (
              <React.Fragment key={d.id}>
                <div className="dt-row" style={{gridTemplateColumns:cols,columnGap:"16px"}}>
                  <span>{fmtDate(d.fecha)}</span>
                  <span style={{textAlign:"right",fontWeight:600,color:ok?"var(--red)":"var(--ink3)"}} title={ok?undefined:"Aún no entra a caja"}>−{fmtCLP(d.monto)}</span>
                  <span style={{display:"flex",flexDirection:"column",gap:2,alignItems:"flex-start"}}>
                    {ok ? (
                      <>
                        <span className="cuota-status-chip st-pagada" style={{marginBottom:0}}>✓ Concretada</span>
                        <span style={{fontSize:10.5,color:"var(--ink3)"}}>el {fmtDate(devFechaCaja(d))}</span>
                      </>
                    ) : (
                      <span className="cuota-status-chip st-proxima" style={{marginBottom:0}}>⏳ En proceso</span>
                    )}
                  </span>
                  <span style={{color:"var(--ink2)",fontSize:12}}>
                    {d.motivo||"—"}
                    {d.notas&&<div style={{fontSize:11,color:"var(--ink3)",marginTop:2}}>{d.notas}</div>}
                  </span>
                  <div style={{display:"flex",gap:6,justifyContent:"flex-end",flexWrap:"wrap"}}>
                    {!ok && concId!==d.id && <button className="btn btn-primary btn-xs" onClick={()=>abrirConcretar(d)} title="Marcar como concretada">✓ Concretar</button>}
                    <button className="btn btn-outline btn-xs" onClick={()=>abrirEditar(d)}>✏️ Editar</button>
                    <button className="btn btn-danger btn-xs" onClick={()=>del(d)}>🗑</button>
                  </div>
                </div>
                {concId===d.id && (
                  <div className="dt-row" style={{display:"flex",flexWrap:"wrap",alignItems:"flex-end",gap:14,background:"var(--green-lt)",padding:"10px 12px"}}>
                    <div style={{fontSize:12.5,fontWeight:600,color:"var(--green)",alignSelf:"center"}}>✓ Marcar como concretada</div>
                    <div className="field"><label>Monto final ($CLP)</label>
                      <input type="number" value={concForm.monto} onChange={e=>setConcForm(f=>({...f,monto:e.target.value}))} style={{width:150,textAlign:"right"}}/>
                    </div>
                    <div className="field"><label>Fecha de concreción</label>
                      <input type="date" value={concForm.fecha_concretada} onChange={e=>setConcForm(f=>({...f,fecha_concretada:e.target.value}))}/>
                    </div>
                    <div style={{display:"flex",gap:6,marginLeft:"auto"}}>
                      <button className="btn btn-primary btn-xs" onClick={()=>concretar(d)} disabled={concBusy}>{concBusy?"Guardando...":"Confirmar"}</button>
                      <button className="btn btn-ghost btn-xs" onClick={()=>setConcId(null)}>Cancelar</button>
                    </div>
                  </div>
                )}
              </React.Fragment>
            );
          })}
        </div>
      )}
    </>
  );
}

// BITÁCORA TAB
// ─────────────────────────────────────────────────────
function BitacoraTab({terreno, bitacora, archivos, subtareas, archivosSub, onRefresh, user}) {
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({fecha:today(), detalle:"", estatus:"Pendiente", responsable:"", prioridad:"Media"});
  const [openId, setOpenId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [uploading, setUploading] = useState({});
  const [addBusy, setAddBusy] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const setEF = (k,v) => setEditForm(f=>({...f,[k]:v}));

  const _proj = `${terreno.terreno||terreno.rol} · ${terreno.rol}`;

  const addEntry = async () => {
    if(!form.detalle.trim()) return;
    setAddBusy(true);
    try{
      await db.insert("bitacora",[{
        terreno_rol:terreno.rol, fecha:form.fecha, detalle:form.detalle.trim(),
        estatus:form.estatus, responsable:form.responsable?.trim()||null,
        prioridad:form.prioridad||"Media"
      }]);
      logAudit("nueva_bitacora",`Nueva entrada de bitácora en "${terreno.terreno||terreno.rol}": "${form.detalle.trim().slice(0,80)}${form.detalle.trim().length>80?"…":""}"`,_proj);
      setForm({fecha:today(),detalle:"",estatus:"Pendiente",responsable:"",prioridad:"Media"});
      setShowAdd(false);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
    setAddBusy(false);
  };

  const saveEdit = async (entry) => {
    try{
      await db.patch("bitacora","id=eq."+entry.id, {
        fecha:editForm.fecha, detalle:editForm.detalle, estatus:editForm.estatus,
        responsable:editForm.responsable?.trim()||null,
        prioridad:editForm.prioridad||"Media"
      });
      logAudit("editar_bitacora",`Editó entrada de bitácora en "${terreno.terreno||terreno.rol}": "${String(editForm.detalle||"").slice(0,80)}${(editForm.detalle||"").length>80?"…":""}"`,_proj);
      setEditingId(null);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  const deleteEntry = async (entry) => {
    if(!confirm("¿Eliminar esta entrada y todos sus archivos adjuntos?")) return;
    try{
      await db.del("bitacora","id=eq."+entry.id);
      logAudit("eliminar_bitacora",`Eliminó entrada de bitácora en "${terreno.terreno||terreno.rol}": "${String(entry.detalle||"").slice(0,80)}${(entry.detalle||"").length>80?"…":""}"`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  const uploadFile = async (entryId, file) => {
    const err = validateUploadFile(file);
    if(err){ alert(err); return; }
    setUploading(u=>({...u,[entryId]:true}));
    try{
      const ext = file.name.split(".").pop()||"bin";
      const path = `${terreno.rol.replace(/\//g,"-")}/${entryId}/${uid()}.${ext}`;
      const url = await db.uploadFile("terrenos-archivos", path, file);
      await db.insert("archivos",[{bitacora_id:entryId, nombre:file.name, url, tipo:file.type, tamano:file.size}]);
      logAudit("subir_archivo",`Adjuntó archivo "${file.name}" a una entrada de bitácora en "${terreno.terreno||terreno.rol}"`,_proj);
      onRefresh();
    }catch(e){alert("Error al subir archivo: "+e.message);}
    setUploading(u=>({...u,[entryId]:false}));
  };

  const deleteFile = async (a) => {
    if(!confirm("¿Eliminar este archivo?")) return;
    try{
      await db.del("archivos","id=eq."+a.id);
      logAudit("eliminar_archivo",`Eliminó archivo "${a.nombre||"sin nombre"}" de bitácora en "${terreno.terreno||terreno.rol}"`,_proj);
      onRefresh();
    }catch(e){alert("Error: "+e.message);}
  };

  const sorted = [...bitacora].sort((a,b)=>b.fecha.localeCompare(a.fecha));

  return (
    <>
      <div className="bitacora-add-bar">
        <span style={{fontSize:13,color:"var(--ink3)"}}>{bitacora.length} {bitacora.length===1?"entrada":"entradas"}</span>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(s=>!s)}>
          {showAdd?"✕ Cancelar":"+ Nueva entrada"}
        </button>
      </div>

      {showAdd&&(
        <div className="add-entry-box">
          <div className="title">Nueva entrada de bitácora</div>
          <div className="field-row" style={{marginBottom:10}}>
            <div className="field"><label>Fecha</label><input type="date" value={form.fecha} onChange={e=>set("fecha",e.target.value)}/></div>
            <div className="field"><label>Estatus</label>
              <select value={form.estatus} onChange={e=>set("estatus",e.target.value)}>
                {ESTATUS_OPTS.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
            <div className="field"><label>Prioridad</label>
              <select value={form.prioridad} onChange={e=>set("prioridad",e.target.value)}>
                {PRIORIDADES.map(p=><option key={p}>{p}</option>)}
              </select>
            </div>
          </div>
          <div className="field" style={{marginBottom:10}}>
            <label>Detalle / Tarea</label>
            <textarea value={form.detalle} onChange={e=>set("detalle",e.target.value)} placeholder="Describe la acción, tarea o nota relevante del terreno..."/>
          </div>
          <div className="field" style={{marginBottom:14}}>
            <label>Responsable</label>
            <ResponsableField value={form.responsable} onChange={v=>set("responsable",v||"")} options={BITACORA_RESPONSABLES}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-primary btn-sm" onClick={addEntry} disabled={!form.detalle.trim()||addBusy}>{addBusy?"Guardando...":"Guardar entrada"}</button>
          </div>
        </div>
      )}

      {sorted.length===0 ? (
        <div style={{textAlign:"center",padding:"50px 20px",color:"var(--ink3)"}}>
          <div style={{fontSize:38,marginBottom:14}}>📓</div>
          <p>Sin entradas en la bitácora de este terreno.</p>
        </div>
      ):(
        <div className="bitacora-list">
          {sorted.map(entry=>{
            const files = archivos[entry.id]||[];
            const isOpen = openId===entry.id;
            const isEditing = editingId===entry.id;
            const st = entry.estatus;
            return (
              <div key={entry.id} className="bita-entry">
                <div className="bita-header" onClick={()=>setOpenId(isOpen?null:entry.id)}>
                  <div className="bita-date">{fmtDate(entry.fecha)}</div>
                  <div className="bita-detalle">{entry.detalle}</div>
                  <div className="bita-meta">
                    {entry.prioridad&&<span className={`prio-chip prio-${entry.prioridad.toLowerCase()}`}>{entry.prioridad}</span>}
                    <span className={`estatus-chip est-${st==="En Proceso"?"proceso":st.toLowerCase()}`}>{st}</span>
                    {entry.responsable&&<span style={{fontSize:11,color:"var(--ink3)"}}>👤 {entry.responsable}</span>}
                    {files.length>0&&<span style={{fontSize:11,color:"var(--ink3)"}}>📎{files.length}</span>}
                    <span style={{fontSize:10,color:"var(--ink3)"}}>{isOpen?"▲":"▼"}</span>
                  </div>
                </div>

                {isOpen&&(
                  <div className="bita-body" onClick={e=>e.stopPropagation()}>
                    {isEditing ? (
                      <>
                        <div className="field-row" style={{marginBottom:9}}>
                          <div className="field"><label>Fecha</label><input type="date" value={editForm.fecha} onChange={e=>setEF("fecha",e.target.value)}/></div>
                          <div className="field"><label>Estatus</label>
                            <select value={editForm.estatus} onChange={e=>setEF("estatus",e.target.value)}>
                              {ESTATUS_OPTS.map(s=><option key={s}>{s}</option>)}
                            </select>
                          </div>
                          <div className="field"><label>Prioridad</label>
                            <select value={editForm.prioridad||"Media"} onChange={e=>setEF("prioridad",e.target.value)}>
                              {PRIORIDADES.map(p=><option key={p}>{p}</option>)}
                            </select>
                          </div>
                        </div>
                        <div className="field" style={{marginBottom:9}}>
                          <label>Detalle</label>
                          <textarea value={editForm.detalle} onChange={e=>setEF("detalle",e.target.value)} rows={3}/>
                        </div>
                        <div className="field" style={{marginBottom:12}}>
                          <label>Responsable</label>
                          <ResponsableField value={editForm.responsable||""} onChange={v=>setEF("responsable",v||null)} options={BITACORA_RESPONSABLES}/>
                        </div>
                        <div style={{display:"flex",gap:8,marginBottom:14}}>
                          <button className="btn btn-primary btn-sm" onClick={()=>saveEdit(entry)}>Guardar</button>
                          <button className="btn btn-ghost btn-sm" onClick={()=>setEditingId(null)}>Cancelar</button>
                        </div>
                      </>
                    ):(
                      <div style={{display:"flex",gap:7,marginBottom:files.length>0?12:0}}>
                        <button className="btn btn-outline btn-xs" onClick={()=>{setEditingId(entry.id);setEditForm({...entry});}}>✏️ Editar</button>
                        <button className="btn btn-danger btn-xs" onClick={()=>deleteEntry(entry)}>🗑 Eliminar</button>
                      </div>
                    )}

                    {files.length>0&&(
                      <div className="files-list">
                        {files.map(f=>(
                          <div key={f.id} className="file-item">
                            <span className="file-icon">{fileIcon(f.tipo)}</span>
                            {safeHref(f.url)
                            ? <a href={safeHref(f.url)} target="_blank" rel="noopener noreferrer" className="file-name">{f.nombre}</a>
                            : <span className="file-name" title="Enlace no válido">{f.nombre}</span>}
                            <span className="file-size">{fmtSize(f.tamano)}</span>
                            <button className="file-del" onClick={()=>deleteFile(f)}>🗑</button>
                          </div>
                        ))}
                      </div>
                    )}

                    {/* Adjuntar archivos deshabilitado por seguridad (bucket privado).
                        La lógica de subida se conserva por si se reactiva más adelante. */}
                    <SubtareasSection
                      bitacoraId={entry.id}
                      terrenoRol={terreno.rol}
                      subtareas={subtareas[entry.id]||[]}
                      archivosSub={archivosSub}
                      onRefresh={onRefresh}
                    />
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </>
  );
}

// NEW TERRENO MODAL
// ─────────────────────────────────────────────────────
function NewTerrenoModal({onClose, onCreated}) {
  const [form,setForm]=useState({rol:"",terreno:"",ciudad:"Antofagasta",vigente:"SI",estado:"Activo",m2_sii:"",avaluo:"",sobretasa:false,proyecto:"",notas:""});
  const [saving,setSaving]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const create = async () => {
    if(!form.rol.trim()||!form.terreno.trim()||!form.ciudad){return;}
    setSaving(true);
    try{
      await db.insert("terrenos",[{
        rol:form.rol.trim(), terreno:form.terreno.trim(), ciudad:form.ciudad, vigente:form.vigente, estado:form.estado,
        m2_sii:parseFloat(form.m2_sii)||0, avaluo:parseInt(form.avaluo)||0,
        sobretasa:form.sobretasa, proyecto:form.proyecto||null,
        responsable:form.responsable||null, notas:form.notas||null
      }]);
      logAudit("nuevo_terreno",`Creó terreno "${form.terreno.trim()}" (${form.ciudad})`,`${form.terreno.trim()} · ${form.rol.trim()}`);
      onCreated();onClose();
    }catch(e){alert("Error: "+e.message);}
    setSaving(false);
  };

  return (
    <Modal title="Nuevo Terreno" onClose={onClose} large
      footer={<>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={create} disabled={!form.rol.trim()||!form.terreno.trim()||saving}>
          {saving?"Guardando...":"Crear terreno"}
        </button>
      </>}>
      <div className="field-row">
        <div className="field"><label>ROL SII *</label><input value={form.rol} onChange={e=>set("rol",e.target.value)} placeholder="ej: 5511-01"/></div>
        <div className="field"><label>Ciudad *</label>
          <select value={form.ciudad} onChange={e=>set("ciudad",e.target.value)}>
            {CIUDADES.map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
      </div>
      <div className="field"><label>Nombre del terreno *</label><input value={form.terreno} onChange={e=>set("terreno",e.target.value)} placeholder="ej: LOTE 1A3 CERRO PARANAL 315"/></div>
      <div className="field-row">
        <div className="field"><label>M² SII</label>
          <input type="text" inputMode="decimal"
            value={fmtCLInput(form.m2_sii, true)}
            onChange={e=>set("m2_sii", parseCLInput(e.target.value, true))}/>
        </div>
        <div className="field"></div>
      </div>
      <div className="field-row">
        <div className="field"><label>Avalúo fiscal ($CLP)</label>
          <input type="text" inputMode="numeric"
            value={fmtCLInput(form.avaluo, false)}
            onChange={e=>set("avaluo", parseCLInput(e.target.value, false))}/>
        </div>
        <div className="field"><label>Proyecto asociado</label><input value={form.proyecto} onChange={e=>set("proyecto",e.target.value)} placeholder="ej: Las Vicuñas"/></div>
      </div>
      <div className="field-row">
        <div className="field"><label>Sobretasa</label>
          <select value={form.sobretasa?"Si":"No"} onChange={e=>set("sobretasa",e.target.value==="Si")}>
            <option>No</option><option>Si</option>
          </select>
        </div>
        <div className="field"></div>
      </div>
      <div className="field"><label>Notas</label><textarea value={form.notas} onChange={e=>set("notas",e.target.value)} rows={2} placeholder="Observaciones adicionales..."/></div>
    </Modal>
  );
}

function App({user, onLogout}) {

  const [allBitacora, setAllBitacora] = useState([]);
  const [allDevoluciones, setAllDevoluciones] = useState([]);
  const [subtareas, setSubtareas] = useState({});
  const [archivosSub, setArchivosSub] = useState({});
  const [hiddenRols, setHiddenRols] = useState(()=>new Set(JSON.parse(localStorage.getItem('hiddenRols')||'[]')));
  const hideDirtyRef = useRef(false); // true mientras hay un cambio de ocultos guardándose
  const loadSeqRef = useRef(0); // descarta respuestas de un terreno ya no seleccionado
  // Memoria para mostrar un terreno al instante al seleccionarlo (ver primeDetail).
  const [allAdjuntos, setAllAdjuntos] = useState(null);
  // {archivos, subtareas, archivosSub}; null si no se pudieron cargar
  // Módulo Valorización (independiente de contribuciones)
  const [modulo, setModulo] = useState(()=>{ try{ return localStorage.getItem("gt_modulo")==="valor" ? "valor" : "contrib"; }catch(e){ return "contrib"; } });
  const [valores, setValores] = useState(null); // tabla valores_terrenos; null si no está disponible
  const [selLote, setSelLote] = useState(null);
  const [buscaLote, setBuscaLote] = useState("");
  const [comunasCerradas, setComunasCerradas] = useState({});
  const [showImport, setShowImport] = useState(false);
  const contentRef = useRef(null);
  const vzScrollRef = useRef(0); // posición del resumen, para volver al mismo lugar
  const cacheListoRef = useRef(false);  // true cuando loadAll terminó bien al menos una vez
