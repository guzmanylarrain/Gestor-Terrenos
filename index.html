  const loadUfClp = useCallback(async () => {
    try{
      const rows = await db.select("app_config","id=eq.main&select=uf_clp,hidden_rols");
      if(rows && rows[0]){
        if(rows[0].uf_clp){ setUfClp(parseFloat(rows[0].uf_clp)||40027); }
        // Lista de ocultos COMPARTIDA (en DB). Solo se sobreescribe el estado
        // si el usuario no tiene una edición pendiente sin guardar.
        if(Array.isArray(rows[0].hidden_rols) && !hideDirtyRef.current){
          const serverSet = rows[0].hidden_rols;
          const localArr = JSON.parse(localStorage.getItem('hiddenRols')||'[]');
          // Migración una sola vez: si el servidor está vacío pero este navegador
          // ya tenía ocultos, los subimos para no perderlos al pasar a compartido.
          if(serverSet.length===0 && localArr.length>0 && localStorage.getItem('hiddenMigrated')!=='1'){
            localStorage.setItem('hiddenMigrated','1');
            db.patch("app_config","id=eq.main", {hidden_rols: localArr, updated_at: new Date().toISOString()}).catch(()=>{});
            setHiddenRols(new Set(localArr));
          } else {
            localStorage.setItem('hiddenMigrated','1');
            setHiddenRols(new Set(serverSet));
            localStorage.setItem('hiddenRols', JSON.stringify(serverSet));
          }
        }
      }
    }catch(e){ console.warn("No se pudo cargar config del app_config"); }
  }, []);

      logAudit("editar_uf_clp",`Actualizó tasa UF: ${fmtCLP(prev)} → ${fmtCLP(val)}`,"");

      setTerrenos(t); setAllCuotas(c); setAllBitacora(b); setAllDevoluciones(d);

  const seedIfEmpty = useCallback(async () => {
    if(!window.INITIAL_DATA||window.INITIAL_DATA.length===0) return;
    try{
      const existing = await db.select("terrenos","limit=1");
      if(existing.length>0) return; // already has data
      const anio = new Date().getFullYear();
      const CUOTA_DATES_LOCAL = {1:"04-30",2:"06-30",3:"09-30",4:"11-28"};
      // Insert terrenos
      const terrenosArr = window.INITIAL_DATA.map(d=>({
        rol:d.rol, terreno:d.terreno, vigente:d.vigente||"SI", ciudad:d.ciudad,
        m2_sii:d.m2_sii||0, avaluo:d.avaluo||0,
        sobretasa:d.sobretasa||false, proyecto:d.proyecto||null,
        responsable:null, notas:null
      }));
      await db.upsert("terrenos", terrenosArr);
      // Insert cuotas
      const cuotasArr = [];
      window.INITIAL_DATA.forEach(d=>{
        if(!d.cuota_monto) return;
        for(let n=1;n<=4;n++){
          cuotasArr.push({terreno_rol:d.rol,anio,numero:n,
            monto:d.cuota_monto,tasa:d.tasa||0,
            fecha_vencimiento:`${anio}-${CUOTA_DATES_LOCAL[n]}`,pagado:false});
        }
      });
      if(cuotasArr.length>0) await db.upsert("cuotas",cuotasArr);
      // Insert bitácora
      const bitaArr = [];
      window.INITIAL_DATA.forEach(d=>{
        if(d.detalle_tarea){
          bitaArr.push({terreno_rol:d.rol,
            fecha:d.fecha_tarea||new Date().toISOString().slice(0,10),
            detalle:d.detalle_tarea,
            estatus:d.estatus||"Pendiente", responsable:null});
        }
        if(d.extra_bitacora){
          d.extra_bitacora.forEach(e=>{
            if(e.detalle) bitaArr.push({terreno_rol:d.rol,
              fecha:e.fecha||new Date().toISOString().slice(0,10),
              detalle:e.detalle, estatus:e.estatus||"Pendiente", responsable:null});
          });
        }
      });
      for(const b of bitaArr){ try{ await db.insert("bitacora",[b]); }catch(e){} }
      console.log("Seed completado:",terrenosArr.length,"terrenos,",cuotasArr.length,"cuotas,",bitaArr.length,"entradas bitácora");
    }catch(e){console.error("Seed error:",e);}
  },[]);

  const loadDetail = useCallback(async (rol) => {
    if(!rol) return;
    // Contador de solicitudes: si el usuario cambia de terreno mientras una
    // consulta está en curso, la respuesta atrasada se descarta en vez de
    // pisar los datos del terreno que está viendo ahora.
    const seq = ++loadSeqRef.current;
    const vigente = () => seq === loadSeqRef.current;
    try{
      const enc = encodeURIComponent(rol);
      const [c, b, d] = await Promise.all([
        db.select("cuotas","terreno_rol=eq."+enc+"&order=anio.desc,numero.asc"),
        db.select("bitacora","terreno_rol=eq."+enc+"&order=fecha.desc"),
        db.select("devoluciones","terreno_rol=eq."+enc+"&order=fecha.desc")
      ]);
      if(!vigente()) return;
      setCuotas(c); setBitacora(b); setDevoluciones(d);
      // Si el servidor trae algo distinto a lo que había en memoria (un colega editó este
      // terreno), se refresca también la memoria general, para que el dashboard y la próxima
      // visita al terreno ya lo muestren. Se compara sin importar el orden, para que dos
      // registros con la misma fecha no parezcan un cambio y disparen recargas de más.
      const mem = cacheSnapRef.current;
      const huella = rows => JSON.stringify([...rows].sort((x,y)=>String(x.id).localeCompare(String(y.id))));
      const deRol = rows => rows.filter(x=>x.terreno_rol===rol);
      if(cacheListoRef.current && !loadAllBusyRef.current &&
         (huella(c)!==huella(deRol(mem.cuotas)) || huella(b)!==huella(deRol(mem.bitacora)) || huella(d)!==huella(deRol(mem.devoluciones)))){
        loadAll();
      }
      if(b.length>0){
        const ids = b.map(x=>x.id).join(",");
        const a = await db.select("archivos","bitacora_id=in.("+ids+")&order=created_at.asc");
        if(!vigente()) return;
        const map = {};
        a.forEach(f=>{if(!map[f.bitacora_id])map[f.bitacora_id]=[];map[f.bitacora_id].push(f);});
        setArchivos(map);
      }else{setArchivos({});}
      // Load subtareas
      if(b.length>0){
        const bitIds=b.map(x=>x.id).join(",");
        const subs=await db.select("subtareas","bitacora_id=in.("+bitIds+")&order=created_at.asc");
        if(!vigente()) return;
        const subMap={};
        subs.forEach(s=>{if(!subMap[s.bitacora_id])subMap[s.bitacora_id]=[];subMap[s.bitacora_id].push(s);});
        setSubtareas(subMap);
        if(subs.length>0){
          const subIds=subs.map(s=>s.id).join(",");
          const asSub=await db.select("archivos_subtareas","subtarea_id=in.("+subIds+")&order=created_at.asc");
          if(!vigente()) return;
          const asMap={};
          asSub.forEach(f=>{if(!asMap[f.subtarea_id])asMap[f.subtarea_id]=[];asMap[f.subtarea_id].push(f);});
          setArchivosSub(asMap);
        }else{setArchivosSub({});}
      }else{setSubtareas({});setArchivosSub({});}
    }catch(e){console.error(e);}
  },[loadAll]);

      const next=new Set(prev);
      const wasHidden = next.has(rol);
      if(wasHidden) next.delete(rol); else next.add(rol);
      const arr=[...next];
      localStorage.setItem('hiddenRols',JSON.stringify(arr));
      // Guardar la lista COMPARTIDA en la base de datos (afecta a todos los usuarios)
      db.patch("app_config","id=eq.main", {hidden_rols: arr, updated_at: new Date().toISOString(), updated_by: (user && user.email) || ""})
        .then(()=>{
          logAudit(wasHidden?"mostrar_terreno":"ocultar_terreno", `${wasHidden?"Mostró":"Ocultó"} el terreno ${rol} (para todos los usuarios)`, rol);
          hideDirtyRef.current = false;
        })
        .catch(err=>{ hideDirtyRef.current = false; alert("Error al guardar lista de ocultos: "+err.message); });
      return next;
    });

  const exportExcel = () => {
    if(typeof XLSX === "undefined"){ alert("La librería de Excel aún no cargó. Refresca la página e intenta de nuevo."); return; }
    setExcelBusy(true);
    try{
      const anioActual = new Date().getFullYear();
      const hoyStr = today();
      const terr = [...terrenos].sort((a,b)=>(a.ciudad||"").localeCompare(b.ciudad||"")||(a.rol||"").localeCompare(b.rol||""));
      const ufOf = (clp)=> (ufClp&&ufClp>0) ? Math.round((parseFloat(clp)||0)/ufClp) : "";

      // Índices por terreno
      const cuotasByRol={}, devByRol={}, bitaByRol={};
      allCuotas.forEach(c=>{ (cuotasByRol[c.terreno_rol]=cuotasByRol[c.terreno_rol]||[]).push(c); });
      allDevoluciones.forEach(d=>{ (devByRol[d.terreno_rol]=devByRol[d.terreno_rol]||[]).push(d); });
      allBitacora.forEach(b=>{ (bitaByRol[b.terreno_rol]=bitaByRol[b.terreno_rol]||[]).push(b); });

      const wb = XLSX.utils.book_new();

      // ═══════════ HOJA 1 — RESUMEN ═══════════
      const totM2 = terr.reduce((s,t)=>s+(parseFloat(t.m2_sii)||0),0);
      const totAv = terr.reduce((s,t)=>s+(parseInt(t.avaluo)||0),0);
      const conSob = terr.filter(t=>t.sobretasa).length;
      const contribAnio = allCuotas.filter(c=>c.anio===anioActual).reduce((s,c)=>s+(parseInt(c.monto)||0),0);
      // Caja: solo devoluciones concretadas, según la fecha en que se concretaron.
      const devAnioVal = allDevoluciones.filter(d=>devConcretada(d) && (devFechaCaja(d)||"").startsWith(anioActual+"-")).reduce((s,d)=>s+(parseInt(d.monto)||0),0);
      const devProcesoVal = allDevoluciones.filter(d=>!devConcretada(d)).reduce((s,d)=>s+(parseInt(d.monto)||0),0);
      const vencidasAll = allCuotas.filter(c=>!c.pagado && c.fecha_vencimiento && c.fecha_vencimiento<hoyStr);
      const vencidoTotal = vencidasAll.reduce((s,c)=>s+(parseInt(c.monto)||0),0);

      const resumen = [
        ["Gestor de Terrenos — Guzmán & Larraín"],
        ["Exportado", new Date().toLocaleString("es-CL")],
        ["Tasa UF usada (CLP)", ufClp],
        [],
        ["INDICADORES GLOBALES", "CLP", "UF"],
        ["Cantidad de terrenos", terr.length, ""],
        ["Superficie total (m²)", Math.round(totM2), ""],
        ["Avalúo fiscal total", totAv, ufOf(totAv)],
        ["Terrenos con sobretasa", conSob, ""],
        ["Terrenos sin sobretasa", terr.length-conSob, ""],
        ["Contribuciones "+anioActual, contribAnio, ufOf(contribAnio)],
        ["Devoluciones (caja) "+anioActual, devAnioVal, ufOf(devAnioVal)],
        ["Neto "+anioActual, contribAnio-devAnioVal, ufOf(contribAnio-devAnioVal)],
        ["Devoluciones en proceso (aún no en caja)", devProcesoVal, ufOf(devProcesoVal)],
        ["Cuotas vencidas (N°)", vencidasAll.length, ""],
        ["Monto total vencido", vencidoTotal, ufOf(vencidoTotal)],
        [],
        ["BALANCE POR AÑO"],
        ["Año","Contribuciones (CLP)","Devoluciones caja (CLP)","Neto (CLP)"],
      ];
      const balMap = {};
      allCuotas.forEach(c=>{ const y=c.anio; if(!balMap[y])balMap[y]={anio:y,contrib:0,dev:0}; balMap[y].contrib+=parseInt(c.monto)||0; });
      allDevoluciones.forEach(d=>{ if(!devConcretada(d)||!devFechaCaja(d))return; const y=parseInt(devFechaCaja(d).slice(0,4)); if(!balMap[y])balMap[y]={anio:y,contrib:0,dev:0}; balMap[y].dev+=parseInt(d.monto)||0; });
      Object.values(balMap).sort((a,b)=>b.anio-a.anio).forEach(y=>{ resumen.push([y.anio, y.contrib, y.dev, y.contrib-y.dev]); });
      resumen.push([]);
      resumen.push(["CONTRIBUCIONES "+anioActual+" POR CIUDAD"]);
      resumen.push(["Ciudad","Terrenos","Contribuciones (CLP)"]);
      const ciudadMap = {};
      terr.forEach(t=>{ if(!ciudadMap[t.ciudad])ciudadMap[t.ciudad]={n:0,imp:0}; ciudadMap[t.ciudad].n++; });
      allCuotas.filter(c=>c.anio===anioActual).forEach(c=>{ const t=terr.find(x=>x.rol===c.terreno_rol); if(t&&ciudadMap[t.ciudad])ciudadMap[t.ciudad].imp+=parseInt(c.monto)||0; });
      Object.entries(ciudadMap).sort((a,b)=>b[1].imp-a[1].imp).forEach(([city,d])=>{ resumen.push([city, d.n, d.imp]); });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumen), "Resumen");

      // ═══════════ HOJA 2 — BASE (una fila por terreno) ═══════════
      const baseHeader = [
        "ROL","Terreno","Ciudad","Proyecto","Estado","Sobretasa",
        "M² SII","M² Sitio eriazo","M² Terreno construido",
        "Avalúo fiscal (CLP)","Avalúo Sitio eriazo (CLP)","Avalúo Terreno construido (CLP)","UF/m²",
        "Contribuciones totales (CLP)","Contribuciones totales (UF)","Pagado total (CLP)","Por pagar (CLP)","Vencido (CLP)","N° cuotas vencidas",
        "Contribuciones "+anioActual+" (CLP)",
        "Devoluciones concretadas (CLP)","N° devoluciones concretadas","Devoluciones en proceso (CLP)",
        "Neto (Contrib − Dev) (CLP)",
        "Último pago","Próximo vencimiento impago","Tareas bitácora pendientes"
      ];
      const baseRows = [baseHeader];
      terr.forEach(t=>{
        const cs = cuotasByRol[t.rol]||[];
        const ds = devByRol[t.rol]||[];
        const bs = bitaByRol[t.rol]||[];
        const contribTotal = cs.reduce((s,c)=>s+(parseInt(c.monto)||0),0);
        const pagadoTotal = cs.filter(c=>c.pagado).reduce((s,c)=>s+(parseInt(c.monto)||0),0);
        const porPagar = contribTotal - pagadoTotal;
        const vencidas = cs.filter(c=>!c.pagado && c.fecha_vencimiento && c.fecha_vencimiento<hoyStr);
        const vencidoMonto = vencidas.reduce((s,c)=>s+(parseInt(c.monto)||0),0);
        const contribAnioT = cs.filter(c=>c.anio===anioActual).reduce((s,c)=>s+(parseInt(c.monto)||0),0);
        const dsOk = ds.filter(devConcretada);
        const devTotal = dsOk.reduce((s,d)=>s+(parseInt(d.monto)||0),0); // caja
        const devProc = ds.filter(d=>!devConcretada(d)).reduce((s,d)=>s+(parseInt(d.monto)||0),0);
        const ultimoPago = cs.filter(c=>c.fecha_pago).map(c=>c.fecha_pago).sort().pop() || "";
        const proxVenc = cs.filter(c=>!c.pagado && c.fecha_vencimiento).map(c=>c.fecha_vencimiento).sort()[0] || "";
        const pendBita = bs.filter(b=>b.estatus==="Pendiente"||b.estatus==="En Proceso").length;
        const m2 = parseFloat(t.m2_sii)||0, av = parseInt(t.avaluo)||0;
        const ufm2 = (m2>0&&av>0&&ufClp>0) ? Math.round((av/ufClp/m2)*100)/100 : "";
        baseRows.push([
          t.rol, t.terreno||"", t.ciudad||"", t.proyecto||"", estadoDe(t), t.sobretasa?"Sí":"No",
          m2, (t.m2_sii_eriazo!=null?parseFloat(t.m2_sii_eriazo):""), (t.m2_sii_construido!=null?parseFloat(t.m2_sii_construido):""),
          av, (t.avaluo_eriazo!=null?parseInt(t.avaluo_eriazo):""), (t.avaluo_construido!=null?parseInt(t.avaluo_construido):""), ufm2,
          contribTotal, ufOf(contribTotal), pagadoTotal, porPagar, vencidoMonto, vencidas.length,
          contribAnioT,
          devTotal, dsOk.length, devProc,
          contribTotal-devTotal,
          ultimoPago, proxVenc, pendBita
        ]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(baseRows), "Base");

      const stamp = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, "gestor-terrenos-"+stamp+".xlsx");
      logAudit("exportar_excel", "Exportó la información a Excel (Resumen + Base)", "");
    }catch(e){
      alert("Error al exportar Excel: "+e.message);
    }
    setExcelBusy(false);
  };

  const selTerreno = terrenos.find(t=>t.rol===selRol);

  // Sidebar groups — ordenar ciudades de norte a sur (segun CIUDADES) y
  // terrenos dentro de cada ciudad por ROL (numéricamente, no alfabético).
  const compareRol = (a, b) => {
    const pa = String(a.rol||"").split("-").map(x=>parseInt(x,10)||0);
    const pb = String(b.rol||"").split("-").map(x=>parseInt(x,10)||0);
    const n = Math.max(pa.length, pb.length);
    for(let i=0;i<n;i++){
      const va = pa[i]||0, vb = pb[i]||0;
      if(va !== vb) return va - vb;
    }
    return String(a.rol||"").localeCompare(String(b.rol||""));
  };
  const cityRank = {};
  CIUDADES.forEach((c,i)=>{ cityRank[c] = i; });
  const cityMap={}, cityOrder=[];
  terrenos
    .filter(t=>{
      const sOK = !search||(t.terreno+" "+t.rol+" "+(t.proyecto||"")).toLowerCase().includes(search.toLowerCase());
      // Modo "Ocultos": solo los ocultos, para revisarlos. Modo normal: solo los visibles.
      const vOK = showHidden ? hiddenRols.has(t.rol) : !hiddenRols.has(t.rol);
      return sOK && vOK;
    })
    .forEach(t=>{
      if(!cityMap[t.ciudad]){cityMap[t.ciudad]=[];cityOrder.push(t.ciudad);}
      cityMap[t.ciudad].push(t);
    });
  // Reordenar ciudades: las listadas en CIUDADES siguen ese orden, el resto al final (alfabético)
  cityOrder.sort((a,b)=>{
    const ra = cityRank[a]!==undefined ? cityRank[a] : 999;
    const rb = cityRank[b]!==undefined ? cityRank[b] : 999;
    if(ra !== rb) return ra - rb;
    return String(a).localeCompare(String(b));
  });
  // Ordenar los terrenos de cada ciudad por ROL numérico
  Object.keys(cityMap).forEach(c=>{ cityMap[c].sort(compareRol); });

  const hasBadge = (_rol) => "#5a5750"; // Punto gris neutro para todos (sin semáforo)

  // Muestra al instante los datos de un terreno con lo que loadAll ya tiene en memoria, en el
  // mismo render en que se selecciona: sin esperar a la red y sin mostrar por un momento los
  // datos del terreno anterior. loadDetail los confirma después con el servidor.
  const primeDetail = (rol) => {
    if(!cacheListoRef.current){
      setCuotas([]); setBitacora([]); setDevoluciones([]); setArchivos({}); setSubtareas({}); setArchivosSub({});
      return;
    }
    const agrupar = (rows, key) => { const m={}; rows.forEach(r=>{ (m[r[key]]=m[r[key]]||[]).push(r); }); return m; };
    const b = allBitacora.filter(x=>x.terreno_rol===rol);
    setCuotas(allCuotas.filter(x=>x.terreno_rol===rol));
    setBitacora(b);
    setDevoluciones(allDevoluciones.filter(x=>x.terreno_rol===rol));
    if(allAdjuntos){
      const bitIds = new Set(b.map(x=>x.id));
      const subs = allAdjuntos.subtareas.filter(x=>bitIds.has(x.bitacora_id));
      const subIds = new Set(subs.map(x=>x.id));
      setArchivos(agrupar(allAdjuntos.archivos.filter(x=>bitIds.has(x.bitacora_id)),"bitacora_id"));
      setSubtareas(agrupar(subs,"bitacora_id"));
      setArchivosSub(agrupar(allAdjuntos.archivosSub.filter(x=>subIds.has(x.subtarea_id)),"subtarea_id"));
    }else{ setArchivos({}); setSubtareas({}); setArchivosSub({}); }
  };

  const selectTerreno = (rol) => {
    // Si vuelve a hacer clic en el mismo terreno no se repinta desde memoria: loadDetail no se
    // volvería a ejecutar y quedaría la versión de memoria en vez de la ya confirmada.
    if(rol!==selRol) primeDetail(rol);
    setSelRol(rol); setActiveTab("info");
    // auto-open that city
    const t = terrenos.find(x=>x.rol===rol);
    if(t) setOpenCities(prev=>({...prev,[t.ciudad]:true}));
  };

  // ── Módulo Valorización ──
  const cambiarModulo = m => { setModulo(m); try{ localStorage.setItem("gt_modulo", m); }catch(e){} };
  const lotesVz = useMemo(()=>prepararLotes(valores, ufClp), [valores, ufClp]);
  const qLote = buscaLote.trim().toLowerCase();
  const gruposVz = useMemo(()=>agruparLotes((lotesVz||[]).filter(l=>!qLote ||
    [l.nombre,l.rol,l.proyecto,l.comuna,l.propietario].some(x=>x && String(x).toLowerCase().includes(qLote)))), [lotesVz, qLote]);
  const loteSel = (lotesVz && selLote) ? lotesVz.find(l=>l.key===selLote) || null : null;
  // Orden para recorrer lote a lote: el de la barra lateral (si la búsqueda deja fuera el lote, todos)
  const ordenVz = useMemo(()=>{
    const vis = gruposVz.flatMap(g=>g.lotes);
    return (!loteSel || vis.some(l=>l.key===loteSel.key)) ? vis : agruparLotes(lotesVz||[]).flatMap(g=>g.lotes);
  }, [gruposVz, lotesVz, loteSel]);
  const abrirLote = key => {
    if(!selLote && contentRef.current) vzScrollRef.current = contentRef.current.scrollTop;
    setSelLote(key);
  };
  const volverResumen = useCallback(()=>setSelLote(null), []);
  useEffect(()=>{
    if(!contentRef.current) return;
    contentRef.current.scrollTop = (modulo==="valor" && !selLote) ? vzScrollRef.current : 0;
  }, [selLote, modulo]);
  const guardarObsLote = async (lote, obs) => {
    const txt = obs.trim() || null;
    await db.patch("valores_terrenos", "id=eq."+lote.id, {obs:txt});
    logAudit("editar_obs_valor", `Editó las observaciones de valorización de "${lote.nombre}"${lote.rol?" ("+lote.rol+")":""}`, lote.nombre||"");
    await loadValores();
  };

  return (
    <div className="app">
      {/* ─ SIDEBAR ─ */}
      <div className="sidebar">
        <div className="sidebar-brand">
          <div className="sidebar-logo-wrap"><img src="logo.jpg" alt="Guzmán & Larraín"/></div>
          <h1>Gestor de Terrenos</h1>
        </div>
        <div className="mod-switch">
          <button className={modulo==="contrib"?"on":""} onClick={()=>cambiarModulo("contrib")}>📋 Contribuciones</button>
          <button className={modulo==="valor"?"on":""} onClick={()=>cambiarModulo("valor")}>💲 Valorización</button>
        </div>
        {modulo==="valor" ? (
          <VzSidebar grupos={gruposVz} total={lotesVz?lotesVz.length:0} busca={buscaLote} setBusca={setBuscaLote}
            sel={selLote} onSel={abrirLote} cerradas={comunasCerradas} setCerradas={setComunasCerradas}
            onResumen={volverResumen} onImportar={()=>setShowImport(true)}/>
        ) : (<>
        <div className="sidebar-search">
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar terreno o ROL..."/>
        </div>

        <div className="terreno-list">
          {showHidden && (
            <div style={{fontSize:11.5,color:"#c9c5bc",padding:"8px 14px 6px",lineHeight:1.4}}>
              🙈 Mostrando solo los <b>{hiddenRols.size}</b> terrenos ocultos. Haz clic en uno para revisarlo o editarlo.
            </div>
          )}
          {showHidden && hiddenRols.size===0 && (
            <div style={{fontSize:11.5,color:"#c9c5bc",padding:"0 14px 8px"}}>No hay terrenos ocultos.</div>
          )}
          {cityOrder.map(city=>{
            const items=cityMap[city]; const isOpen=!!openCities[city];
            const hasActive=items.some(t=>t.rol===selRol);
            return (
              <div key={city} className="city-group">
                <div className="city-header" onClick={()=>setOpenCities(p=>({...p,[city]:!p[city]}))}>
                  <span className={`city-arrow${isOpen?" open":""}`}>▶</span>
                  <span className="city-name" style={hasActive?{color:"#a0c8d0"}:{}}>{city}</span>
                  <span className="city-count">{items.length}</span>
                </div>
                {isOpen&&(
                  <div className="city-terrenos">
                    {items.map(t=>{
                      const isHidden=hiddenRols.has(t.rol);
                      return (
                        <div key={t.rol}
                          className={`terreno-item${selRol===t.rol?" active":""}${isHidden?" hidden-item":""}`}
                          onClick={()=>selectTerreno(t.rol)}>
                          <span className="t-dot" style={{background:isHidden?"#5a5750":hasBadge(t.rol)}}/>
                          <div className="t-info">
                            <div className="t-name">{t.terreno}</div>
                            <div className="t-rol">{t.rol}</div>
                          </div>
                          <button className="hide-btn" onClick={(e)=>toggleHide(t.rol,e)}
                            title={isHidden?"Mostrar terreno":"Ocultar terreno"}>
                            {isHidden?"👁":"🙈"}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
          {cityOrder.length===0&&!loading&&(
            <div style={{padding:"20px 10px",color:"#5a5750",fontSize:12,textAlign:"center"}}>
              Sin terrenos.<br/>Importa el Excel o crea uno nuevo.
            </div>
          )}
        </div>

        <div className="sidebar-bottom">
          <button className="sbtn sbtn-primary" onClick={()=>setShowNew(true)}>＋ Nuevo terreno</button>
          <button className="sbtn sbtn-ghost" onClick={exportJSON} disabled={exportBusy} title="Descargar respaldo de todos los datos en JSON">
            {exportBusy ? "⏳ Generando respaldo..." : "⇩ Descargar respaldo (JSON)"}
          </button>
          <button className="sbtn sbtn-ghost" onClick={()=>setSelRol(null)}>⊞ Dashboard global</button>
          {(hiddenRols.size>0 || showHidden)&&(
            <button className="sbtn sbtn-ghost" onClick={()=>{
              const entrar = !showHidden;
              setShowHidden(entrar);
              if(entrar){
                const abiertas = {};
                terrenos.forEach(t=>{ if(hiddenRols.has(t.rol)) abiertas[t.ciudad]=true; });
                setOpenCities(p=>({...p, ...abiertas}));
              }
            }}>
              {showHidden?"← Volver a todos los terrenos":"👁 Ver solo ocultos ("+hiddenRols.size+")"}
            </button>
          )}
        </div>
        </>)}

        <UserBar user={user} onLogout={onLogout}/>
        <div className="sync-bar">
          <div className={`sync-dot ${syncStatus==="loading"?"loading":syncStatus==="error"?"error":"ok"}`}/>
          <span className="sync-text">{syncStatus==="loading"?"Sincronizando...":syncStatus==="error"?"Error de conexión":"Conectado"}</span>
          <button className="sync-refresh" onClick={loadAll} title="Recargar">↺</button>
        </div>
      </div>

      {/* ─ MAIN ─ */}
      <div className="main">
        <div className="topbar">
          <div className="topbar-left">
            {modulo==="valor" ? (loteSel ? (
              <>
                <h2>{loteSel.nombre}</h2>
                <span style={{fontFamily:"monospace",fontSize:11.5,color:"var(--ink3)",background:"var(--bg2)",padding:"2px 8px",borderRadius:4,flexShrink:0}}>{loteSel.rol||"sin ROL"}</span>
                {loteSel.comuna&&<span style={{fontSize:12,color:"var(--ink3)"}}>{loteSel.comuna}</span>}
              </>
            ):<h2>Valorización de terrenos</h2>) : selTerreno ? (
              <>
                <h2>{selTerreno.terreno}</h2>
                <span style={{fontFamily:"monospace",fontSize:11.5,color:"var(--ink3)",background:"var(--bg2)",padding:"2px 8px",borderRadius:4,flexShrink:0}}>{selTerreno.rol}</span>
                {selTerreno.ciudad&&<span style={{fontSize:12,color:"var(--ink3)"}}>{selTerreno.ciudad}</span>}
              </>
            ):<h2>Dashboard de Terrenos</h2>}
          </div>
          <div className="topbar-right">
            {modulo==="valor" ? (
              <span style={{fontSize:12,color:"var(--ink3)"}}>{lotesVz?lotesVz.length:0} lotes · UF {fmtCLP(ufClp)}</span>
            ) : (<>
            <span style={{fontSize:12,color:"var(--ink3)"}}>
              {terrenos.length} terrenos · {allCuotas.filter(c=>!c.pagado&&c.fecha_vencimiento&&c.fecha_vencimiento<today()).length} cuotas vencidas
            </span>
            <button className="btn btn-outline btn-sm" onClick={exportExcel} disabled={excelBusy} title="Exportar la información a Excel (.xlsx)">
              {excelBusy ? "⏳ Generando..." : "📊 Exportar Excel"}
            </button>
            </>)}
            <div className="audit-bell-wrap" ref={auditRef}>
              <button className="audit-bell-btn" onClick={()=>{setShowAudit(s=>!s); setAuditUnread(0);}} title="Historial de cambios">
                🔔
                {auditUnread>0 && <span className="audit-badge">{auditUnread>99?"99+":auditUnread}</span>}
              </button>
              {showAudit && (
                <div className="audit-panel">
                  <div className="audit-panel-head">
                    <h4>🔔 Historial de cambios</h4>
                    <button className="btn btn-ghost btn-xs" onClick={()=>setShowAudit(false)}>✕</button>
                  </div>
                  <div className="audit-list">
                    {auditLogs.length===0 ? (
                      <div className="audit-empty">Sin cambios registrados aún.</div>
                    ) : auditLogs.map((e,i)=>{
                      const dt = new Date(e.created_at);
                      const when = isNaN(dt) ? "—" : dt.toLocaleString("es-CL",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
                      return (
                        <div key={e.id||i} className="audit-entry">
                          <div className="audit-entry-who">
                            <span className="audit-who-name">👤 {e.user_name||e.user_email||"Usuario"}</span>
                            <span className="audit-when">{when}</span>
                          </div>
                          {e.project_name && <div className="audit-entry-proj">📁 {e.project_name}</div>}
                          <div className="audit-entry-desc">{e.description}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>

        <div className="content" ref={contentRef}>
          {loading ? (
            <div className="loading-cover">
              <div className="spinner"/>
              <span style={{color:"var(--ink3)",fontSize:13}}>Cargando terrenos...</span>
            </div>
          ):modulo==="valor" ? (
            !lotesVz ? (
              <div className="dt-empty" style={{padding:"40px 0"}}>No se pudieron cargar los datos de valorización. Revisa la conexión y presiona ↺ (abajo a la izquierda).</div>
            ) : (
              <>
                {/* El resumen queda montado (oculto) al ver un lote, para no perder filtros ni orden */}
                <div style={{display:loteSel?"none":"block"}}>
                  <ValorizacionResumen lotes={lotesVz} ufClp={ufClp} onSaveUfClp={saveUfClp} onOpen={abrirLote}/>
                </div>
                {loteSel && <ValorizacionLote lote={loteSel} orden={ordenVz} lotes={lotesVz} onNav={setSelLote} onVolver={volverResumen} onGuardarObs={guardarObsLote}/>}
              </>
            )
          ):!selTerreno ? (
            <Dashboard terrenos={terrenos} allCuotas={allCuotas} allBitacora={allBitacora} allDevoluciones={allDevoluciones} onSelectTerreno={selectTerreno} hiddenRols={hiddenRols} ufClp={ufClp} onSaveUfClp={saveUfClp}/>
          ):(
            <>
              {hiddenRols.has(selTerreno.rol) && (
                <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",background:"var(--bg2)",border:"1px solid var(--line)",borderRadius:8,padding:"9px 14px",marginBottom:14,fontSize:12.5,color:"var(--ink2)"}}>
                  <span>🙈 <b>Este terreno está oculto:</b> no suma en el avalúo ni en los m² del dashboard. Su historial de contribuciones se mantiene y lo puedes editar igual.</span>
                  <button className="btn btn-outline btn-xs" style={{marginLeft:"auto"}} onClick={()=>toggleHide(selTerreno.rol,{stopPropagation(){}})}>👁 Mostrar</button>
                </div>
              )}
              <div className="tab-nav">
                {[["info","📋 Información"],["cuotas","💰 Contribuciones"],["devoluciones","↩️ Devoluciones"],["bitacora","📓 Bitácora"]].map(([id,lbl])=>(
                  <button key={id} className={`tab-btn${activeTab===id?" active":""}`} onClick={()=>setActiveTab(id)}>{lbl}</button>
                ))}
              </div>

              {activeTab==="info"&&(
                <InfoTab terreno={selTerreno} oculto={hiddenRols.has(selTerreno.rol)} user={user} ufClp={ufClp} cuotas={cuotas} devoluciones={devoluciones} bitacora={bitacora} onUpdated={updated=>{
                  setTerrenos(ts=>ts.map(t=>t.rol===updated.rol?{...t,...updated}:t));
                  loadAll();
                }}/>
              )}
              {activeTab==="cuotas"&&(
                <CuotasTab terreno={selTerreno} cuotas={cuotas} onRefresh={refreshAll}/>
              )}
              {activeTab==="devoluciones"&&(
                <DevolucionesTab terreno={selTerreno} devoluciones={devoluciones} cuotas={cuotas} onRefresh={refreshAll}/>
              )}
              {activeTab==="bitacora"&&(
                <BitacoraTab terreno={selTerreno} bitacora={bitacora} archivos={archivos} subtareas={subtareas} archivosSub={archivosSub} onRefresh={refreshAll} user={user}/>
              )}
            </>
          )}
        </div>
      </div>

      {showNew&&<NewTerrenoModal onClose={()=>setShowNew(false)} onCreated={()=>{setShowNew(false);loadAll();}}/>}
      {showImport&&<ImportarValoresModal actuales={valores||[]} terrenos={terrenos} ufClp={ufClp} onClose={()=>setShowImport(false)}
        onListo={()=>{ setShowImport(false); setSelLote(null); loadValores(); }}/>}
    </div>
  );
}

// SUPABASE AUTH CLIENT
// ─────────────────────────────────────────────────────
let supabaseAuth = null;
let currentUser = null;

function initSupabaseAuth(url, key) {
  if(window.supabase && window.supabase.createClient) {
    supabaseAuth = window.supabase.createClient(url, key);
  }
}

// ─────────────────────────────────────────────────────
// LOGIN SCREEN
// ─────────────────────────────────────────────────────
function AuthScreen({onAuthed, sbUrl, sbKey}) {
  const [mode, setMode] = useState('login'); // login | reset
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');

  const handleLogin = async () => {
    if(!email.trim()||!password.trim()){setError('Ingresa email y contraseña.');return;}
    setBusy(true);setError('');
    try{
      const {data,error:e} = await supabaseAuth.auth.signInWithPassword({email:email.trim(),password});
      if(e) throw e;
      onAuthed(data.user);
    }catch(e){
      setError(e.message==='Invalid login credentials'?'Email o contraseña incorrectos.':e.message);
    }
    setBusy(false);
  };

  const handleReset = async () => {
    if(!email.trim()){setError('Ingresa tu email.');return;}
    setBusy(true);setError('');setSuccess('');
    try{
      const {error:e} = await supabaseAuth.auth.resetPasswordForEmail(email.trim(),{
        redirectTo: window.location.href
      });
      if(e) throw e;
      setSuccess('Te enviamos un email para restablecer tu contraseña.');
    }catch(e){setError(e.message);}
    setBusy(false);
  };

  return (
    <div className="auth-screen">
      <div className="auth-card">
        <div className="auth-logo">
          <div className="auth-logo-wrap"><img src="logo.jpg" alt="Guzmán & Larraín"/></div>
          <h1>Gestor de Terrenos</h1>
          <p>Guzmán & Larraín</p>
        </div>
        {error&&<div className="auth-error">{error}</div>}
        {success&&<div className="auth-success">{success}</div>}
        {mode==='login'?(
          <>
            <div className="field" style={{marginBottom:12}}>
              <label>Email corporativo</label>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
                placeholder="nombre@guzmanlarrain.cl" onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
            </div>
            <div className="field" style={{marginBottom:20}}>
              <label>Contraseña</label>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
            </div>
            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'11px'}}
              onClick={handleLogin} disabled={busy}>
              {busy?'Ingresando...':'Ingresar →'}
            </button>
            <div className="auth-footer">
              <button className="auth-toggle" onClick={()=>{setMode('reset');setError('');setSuccess('');}}>
                ¿Olvidaste tu contraseña?
              </button>
            </div>
          </>
        ):(
          <>
            <p style={{fontSize:13,color:'var(--ink3)',marginBottom:14,lineHeight:1.6}}>
              Ingresa tu email y te enviaremos un link para restablecer tu contraseña.
            </p>
            <div className="field" style={{marginBottom:18}}>
              <label>Email</label>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
                placeholder="nombre@guzmanlarrain.cl" onKeyDown={e=>e.key==='Enter'&&handleReset()}/>
            </div>
            <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'11px'}}
              onClick={handleReset} disabled={busy}>
              {busy?'Enviando...':'Enviar email de recuperación'}
            </button>
            <div className="auth-footer">
              <button className="auth-toggle" onClick={()=>{setMode('login');setError('');setSuccess('');}}>
                ← Volver al login
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function UserBar({user, onLogout}) {
  const initials = user.email?user.email.slice(0,2).toUpperCase():'U';
  const shortEmail = user.email||'';
  const [showChange, setShowChange] = useState(false);
  return (
    <>
      <div className="user-bar">
        <div className="user-avatar">{initials}</div>
        <div className="user-info">
          <div className="user-email">{shortEmail}</div>
          <div className="user-role">Sesión activa</div>
        </div>
        <button className="user-action-btn" onClick={()=>setShowChange(true)} title="Cambiar contraseña">🔑</button>
        <button className="logout-btn" onClick={onLogout} title="Cerrar sesión">⏻</button>
      </div>
      {showChange && <ChangePasswordModal onClose={()=>setShowChange(false)}/>}
    </>
  );
}

function ChangePasswordModal({onClose}) {
  const [newPw, setNewPw] = useState('');
  const [confirmPw, setConfirmPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [success, setSuccess] = useState(false);

  const handleChange = async () => {
    setError('');
    if(newPw.length < 8){ setError('La contraseña debe tener al menos 8 caracteres.'); return; }
    if(newPw !== confirmPw){ setError('Las contraseñas no coinciden.'); return; }
    setBusy(true);
    try{
      const {error:e} = await supabaseAuth.auth.updateUser({password:newPw});
      if(e) throw e;
      try{ const s = await supabaseAuth.auth.getSession(); const email = s?.data?.session?.user?.email||""; logAudit("cambio_password",`${email||"El usuario"} cambió su contraseña`,""); }catch{}
      setSuccess(true);
      setTimeout(()=>onClose(), 2000);
    }catch(e){
      setError(e.message || 'Error al cambiar la contraseña.');
      setBusy(false);
    }
  };

  return (
    <Modal title="Cambiar contraseña" onClose={onClose}>
      {success ? (
        <div style={{textAlign:'center',padding:'20px 10px'}}>
          <div style={{fontSize:40,marginBottom:10,color:'var(--green)'}}>✓</div>
          <p style={{color:'var(--green)',fontWeight:500}}>Contraseña actualizada correctamente.</p>
          <p style={{fontSize:12,color:'var(--ink3)',marginTop:8}}>Ya puedes cerrar este diálogo.</p>
        </div>
      ) : (
        <>
          {error && <div className="auth-error">{error}</div>}
          <div className="field" style={{marginBottom:12}}>
            <label>Nueva contraseña</label>
            <input type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} autoFocus placeholder="Mínimo 8 caracteres"/>
          </div>
          <div className="field" style={{marginBottom:16}}>
            <label>Confirmar nueva contraseña</label>
            <input type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&handleChange()}/>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost btn-sm" onClick={onClose} disabled={busy}>Cancelar</button>
            <button className="btn btn-primary btn-sm" onClick={handleChange} disabled={busy||!newPw||!confirmPw}>
              {busy ? 'Cambiando...' : 'Cambiar contraseña'}
            </button>
          </div>
        </>
      )}
    </Modal>
  );
}

function Root() {
  const [phase, setPhase] = useState('loading');
  const [user, setUser] = useState(null);

  useEffect(()=>{
    db = new SupabaseClient('https://hpztcgooeuwacyvniyle.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwenRjZ29vZXV3YWN5dm5peWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODI1ODgsImV4cCI6MjA5MDQ1ODU4OH0.AdJMDIjXfXHGB697u3xyobEfkCM2IePX6lDYTbWtSF0');
    initSupabaseAuth('https://hpztcgooeuwacyvniyle.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwenRjZ29vZXV3YWN5dm5peWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODI1ODgsImV4cCI6MjA5MDQ1ODU4OH0.AdJMDIjXfXHGB697u3xyobEfkCM2IePX6lDYTbWtSF0');
    if(supabaseAuth){
      // Keep db.authToken synced with the active session (handles refresh + logout)
      supabaseAuth.auth.onAuthStateChange((_event, session)=>{
        db.setAuthToken(session?.access_token || null);
      });
      supabaseAuth.auth.getSession().then((res)=>{
        const session = res.data && res.data.session;
        if(session && session.user){
          db.setAuthToken(session.access_token);
          setUser(session.user);
          setPhase('app');
        } else {
          setPhase('auth');
        }
      }).catch(()=>setPhase('auth'));
    } else {
      setTimeout(()=>setPhase('auth'), 500);
    }
  },[]);

  const handleAuthed=async(u)=>{
    try{
      const {data} = await supabaseAuth.auth.getSession();
      if(data?.session?.access_token) db.setAuthToken(data.session.access_token);
    }catch{}
    setUser(u);setPhase('app');
  };

  const handleLogout=async()=>{
    if(supabaseAuth) await supabaseAuth.auth.signOut();
    db.setAuthToken(null);
    setUser(null);setPhase('auth');
  };

  if(phase==='loading') return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--bg)'}}>
      <div className="spinner"/>
    </div>
  );
  if(phase==='auth') return <AuthScreen onAuthed={handleAuthed}/>;
  return <App user={user} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
