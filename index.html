      </div>
      <div className="sidebar-bottom">
        <button className="sbtn sbtn-primary" onClick={onImportar}>⇪ Cargar Excel actualizado</button>
        <button className="sbtn sbtn-ghost" onClick={onResumen}>⊞ Resumen de valorización</button>
      </div>
    </>
  );
}

// ── Exportación a Excel (mismo orden de columnas que el Excel de origen, con totales) ──
function exportarValorizacion(lotes, ufClp, filtrado){
  if(typeof XLSX === "undefined"){ alert("La librería de Excel aún no cargó. Refresca la página e intenta de nuevo."); return; }
  const r0 = v => vacioVz(v) ? "" : Math.round(v);
  const r2 = v => vacioVz(v) ? "" : Math.round(v*100)/100;
  const f = v => v ? fmtDate(v) : "";
  const ord = [...lotes].sort((a,b)=>(a.orden||0)-(b.orden||0));
  const g1 = ["","","","","","","","Superficies","","","Avalúo SII","","","","Comercial (criterio RM)","","","Tasación","","","Valor libro","","","","",""];
  const g2 = ["ROL","Lote","Propietario","Comuna","Proyecto","Detalle","Hipoteca","m² bruto","m² neto","m² SII",
              "Avalúo $","UF","UF/m²","Fecha","UF","UF/m²","× SII","UF","UF/m²","Fecha","$","UF","UF/m²","Fecha","Observaciones","Fila Excel origen"];
  const rows = ord.map(l=>[l.rol||"", l.nombre||"", l.propietario||"", l.comuna||"", l.proyecto||"", l.detalle||"", l.hipoteca||"",
    r2(l.m2Bruto), r2(l.m2Neto), r2(l.m2Sii), r0(l.siiClp), r0(l.siiUf), r2(l.siiUfM2), f(l.sii_fecha),
    r0(l.comUf), r2(l.comUfM2), (l.comUf>0&&l.siiUf>0)?r2(l.comUf/l.siiUf):"", r0(l.tasUf), r2(l.tasUfM2), f(l.tas_fecha),
    r0(l.libClp), r0(l.libUf), r2(l.libUfM2), f(l.libro_fecha), l.obs||"", l.orden||""]);
  const tot = ["TOTAL", ord.length+" lotes","","","","","", r2(sumar(ord,"m2Bruto")), r2(sumar(ord,"m2Neto")), r2(sumar(ord,"m2Sii")),
    r0(sumar(ord,"siiClp")), r0(sumar(ord,"siiUf")), r2(promM2(ord,"siiUf","m2Sii")), "",
    r0(sumar(ord,"comUf")), r2(promM2(ord,"comUf","m2Neto")), r2(ratioVz(ord,"comUf","siiUf")), r0(sumar(ord,"tasUf")), r2(promM2(ord,"tasUf","m2Neto")), "",
    r0(sumar(ord,"libClp")), r0(sumar(ord,"libUf")), "", "", "", ""];
  const aoa = [["Valorización de terrenos — Guzmán & Larraín"],
    ["Exportado: "+new Date().toLocaleString("es-CL"), "UF usada para el avalúo SII: "+(ufClp||""), filtrado?"Con filtros aplicados":"Todos los lotes"],
    [], g1, g2, ...rows, tot];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!merges"] = [{s:{r:3,c:7},e:{r:3,c:9}},{s:{r:3,c:10},e:{r:3,c:13}},{s:{r:3,c:14},e:{r:3,c:16}},{s:{r:3,c:17},e:{r:3,c:19}},{s:{r:3,c:20},e:{r:3,c:23}}];
  ws["!cols"] = [10,34,12,14,18,40,10,11,11,11,16,11,9,11,11,9,8,11,9,11,14,11,9,11,50,9].map(w=>({wch:w}));
  ws["!autofilter"] = {ref:`A5:Z${5+rows.length}`};
  const comunas = agruparLotes(ord).map(g=>[g.comuna, g.lotes.length, r2(sumar(g.lotes,"m2Neto")), r0(sumar(g.lotes,"siiUf")), r0(sumar(g.lotes,"comUf")), r0(sumar(g.lotes,"tasUf")), r0(sumar(g.lotes,"libUf"))]);
  const wsC = XLSX.utils.aoa_to_sheet([["Comuna","Lotes","m² neto","Avalúo SII (UF)","Comercial (UF)","Tasación (UF)","Valor libro (UF)"], ...comunas]);
  wsC["!cols"] = [16,8,12,16,16,16,16].map(w=>({wch:w}));
  const bancos = {};
  ord.forEach(l=>{ const b = esLibre(l.hipoteca) ? "Libre" : (l.hipoteca||"Sin dato"); (bancos[b]=bancos[b]||[]).push(l); });
  const wsB = XLSX.utils.aoa_to_sheet([["Hipoteca","Lotes","m² neto","Comercial (UF)","Tasación (UF)","Avalúo SII (UF)"],
    ...Object.entries(bancos).map(([b,ls])=>[b, ls.length, r2(sumar(ls,"m2Neto")), r0(sumar(ls,"comUf")), r0(sumar(ls,"tasUf")), r0(sumar(ls,"siiUf"))])]);
  wsB["!cols"] = [16,8,12,16,16,16].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Valorización");
  XLSX.utils.book_append_sheet(wb, wsC, "Por comuna");
  XLSX.utils.book_append_sheet(wb, wsB, "Por banco");
  XLSX.writeFile(wb, "valorizacion-terrenos-"+new Date().toISOString().slice(0,10)+".xlsx");
  logAudit("exportar_valorizacion", "Exportó la valorización de terrenos a Excel ("+ord.length+" lotes)", "");
}

// ── Resumen del módulo: indicadores, gráficos y tabla completa ──
function ValorizacionResumen({lotes, ufClp, onSaveUfClp, onOpen}){
  const [fComuna,setFComuna]=useState([]);
  const [fProy,setFProy]=useState([]);
  const [fProp,setFProp]=useState([]);
  const [fHip,setFHip]=useState([]);
  const [grupos,setGrupos]=useState(()=>{
    try{ const g=JSON.parse(localStorage.getItem("gt_vz_grupos")||"null"); if(Array.isArray(g)&&g.length) return g; }catch(e){}
    return ["id","sup","sii","com","tas","lib"];
  });
  const [agrupar,setAgrupar]=useState(true);
  const [orden,setOrden]=useState({col:null,dir:1});
  const toggleGrupo = id => setGrupos(g=>{
    const n = g.includes(id) ? g.filter(x=>x!==id) : [...g,id];
    try{ localStorage.setItem("gt_vz_grupos", JSON.stringify(n)); }catch(e){}
    return n;
  });

  const opts = k => [...new Set(lotes.map(l=>l[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"es"));
  const vis = lotes.filter(l=>(fComuna.length===0||fComuna.includes(l.comuna))
    && (fProy.length===0||fProy.includes(l.proyecto))
    && (fProp.length===0||fProp.includes(l.propietario))
    && (fHip.length===0||fHip.includes(l.hipoteca)));
  const hayFiltros = fComuna.length||fProy.length||fProp.length||fHip.length;
  const limpiar = ()=>{ setFComuna([]); setFProy([]); setFProp([]); setFHip([]); };

  // Por comuna
  const porComuna = agruparLotes(vis).map(g=>({comuna:g.comuna, n:g.lotes.length, sii:sumar(g.lotes,"siiUf"), com:sumar(g.lotes,"comUf"), tas:sumar(g.lotes,"tasUf"), lib:sumar(g.lotes,"libUf")}));
  const serie = VZ_METRICAS.filter(m=>porComuna.some(g=>g[m.k]>0));
  const maxV = Math.max(1, ...porComuna.flatMap(g=>serie.map(m=>g[m.k])));
  const bw=14, gIn=3, gOut=22, padL=60, padB=34, padT=14, chH=170;
  const gW = serie.length*(bw+gIn)-gIn;
  const W = padL + porComuna.length*(gW+gOut) + 10;
  const fmtCorto = v => v>=1e6 ? (v/1e6).toLocaleString("es-CL",{maximumFractionDigits:1})+" M" : v>=1e3 ? Math.round(v/1e3)+" mil" : Math.round(v)+"";
  // Por banco (hipoteca)
  const bancos = {};
  vis.forEach(l=>{ const b = esLibre(l.hipoteca) ? "Libre" : (l.hipoteca||"Sin dato"); (bancos[b]=bancos[b]||[]).push(l); });
  const filasBanco = Object.entries(bancos).map(([b,ls])=>({banco:b, n:ls.length, m2:sumar(ls,"m2Neto"), com:sumar(ls,"comUf"), tas:sumar(ls,"tasUf")}))
    .sort((a,b)=>(a.banco==="Libre")-(b.banco==="Libre") || b.com-a.com);
  const totCom = sumar(vis,"comUf");
  // Top 10 por valor comercial
  const top = [...vis].filter(l=>l.comUf>0).sort((a,b)=>b.comUf-a.comUf).slice(0,10);
  const maxTop = top.length ? top[0].comUf : 1;
  // Antigüedad de las tasaciones
  const buckets = [
    {lbl:"Menos de 1 año", color:"#1a7a4a", test:a=>a!==null&&a<1},
    {lbl:"Entre 1 y 3 años", color:"#d08a3a", test:a=>a!==null&&a>=1&&a<=3},
    {lbl:"Más de 3 años", color:"#c0392b", test:a=>a!==null&&a>3},
    {lbl:"Sin tasación", color:"#c9c5bc", test:a=>a===null},
  ].map(b=>{ const ls=vis.filter(l=>b.test(l.tasUf>0?aniosDesde(l.tas_fecha):null)); return {...b, n:ls.length, m2:sumar(ls,"m2Neto"), com:sumar(ls,"comUf")}; });

  // Tabla
  const cols = VZ_COLS.filter(c=>grupos.includes(c.grupo));
  const gruposVis = VZ_GRUPOS.filter(g=>cols.some(c=>c.grupo===g.id));
  const ordenar = ls => {
    if(!orden.col) return [...ls].sort((a,b)=>(a.orden||0)-(b.orden||0));
    const c = VZ_COLS.find(x=>x.id===orden.col);
    const get = orden.col==="nombre" ? (l=>l.nombre) : (l=>valorCol(c,l));
    return [...ls].sort((a,b)=>{
      const x=get(a), y=get(b), nx=vacioVz(x), ny=vacioVz(y);
      if(nx&&ny) return 0; if(nx) return 1; if(ny) return -1;
      if(typeof x==="number" && typeof y==="number") return (x-y)*orden.dir;
      return String(x).localeCompare(String(y),"es",{numeric:true})*orden.dir;
    });
  };
  const clickOrden = id => setOrden(o=>{
    const esTxt = id==="nombre" || (VZ_COLS.find(x=>x.id===id)||{}).txt || /fecha/.test(id);
    const dir0 = esTxt ? 1 : -1;
    if(o.col!==id) return {col:id, dir:dir0};
    if(o.dir===dir0) return {col:id, dir:-dir0};
    return {col:null, dir:1};
  });
  const flecha = id => orden.col===id ? (orden.dir===1?" ▲":" ▼") : "";
  const bloques = agrupar ? agruparLotes(vis).map(g=>({titulo:g.comuna, lotes:ordenar(g.lotes)})) : [{titulo:null, lotes:ordenar(vis)}];
  const gIni = (i) => i===0 || cols[i-1].grupo!==cols[i].grupo;
  const filaTotales = (ls, cls, titulo) => (
    <tr className={cls}>
      <td className="c-first">{titulo} <span style={{fontWeight:400,opacity:0.7}}>· {ls.length} lote{ls.length===1?"":"s"}</span></td>
      {cols.map((c,i)=><td key={c.id} className={`${c.txt?"c-txt":""} ${gIni(i)?"g-start":""}`}>{totalCol(c,ls)}</td>)}
    </tr>
  );

  return (
    <>
      <UfEditor ufClp={ufClp} onSave={onSaveUfClp}/>
      <div className="dash-filter-bar">
        <label style={{marginRight:4}}>Filtrar:</label>
        <MultiSelect label="Comuna" options={opts("comuna")} selected={fComuna} onChange={setFComuna}/>
        <MultiSelect label="Proyecto" options={opts("proyecto")} selected={fProy} onChange={setFProy}/>
        <MultiSelect label="Propietario" options={opts("propietario")} selected={fProp} onChange={setFProp}/>
        <MultiSelect label="Hipoteca" options={opts("hipoteca")} selected={fHip} onChange={setFHip}/>
        {hayFiltros?<button className="dash-clr" onClick={limpiar}>✕ Limpiar filtros</button>:null}
        <span style={{marginLeft:"auto",fontSize:11,color:"var(--ink3)"}}>{vis.length} de {lotes.length} lotes</span>
        <button className="btn btn-outline btn-sm" onClick={()=>exportarValorizacion(vis, ufClp, !!hayFiltros)}>⬇ Exportar a Excel</button>
      </div>

      <div className="kpi-grid-5">
        <div className="kpi-card teal">
          <div className="kpi-label">Superficie neta</div>
          <div className="kpi-value" style={{fontSize:16}}>{fmtM2v(sumar(vis,"m2Neto"))}</div>
          <div className="kpi-sub">{vis.length} lotes · {porComuna.length} comunas</div>
          <div className="kpi-sub">m² SII: {fmtM2v(sumar(vis,"m2Sii"))}</div>
        </div>
        {VZ_METRICAS.map(m=>{
          const tot=sumar(vis,m.uf), n=contar(vis,m.uf), veces = m.k==="sii" ? null : ratioVz(vis,m.uf,"siiUf"), pm2=promM2(vis,m.uf,m.base);
          return (
            <div key={m.k} className="kpi-card" style={{borderTopColor:m.color}}>
              <div className="kpi-label">{m.lbl}</div>
              <div className="kpi-value" style={{fontSize:16,color:n?m.color:"var(--ink3)"}}>{n?fmtUFv(tot):"Sin datos"}</div>
              <div className="kpi-sub">{n} de {vis.length} lotes con dato{pm2!==null?` · prom. ${fmtUFm2v(pm2)}`:""}</div>
              {m.k==="sii" && n>0 && <div className="kpi-sub">{fmtCLP(sumar(vis,"siiClp"))}</div>}
              {veces!==null && <div className="kpi-sub">{fmtVeces(veces)} el avalúo SII de esos lotes</div>}
              {m.k==="tas" && n>0 && <div className="kpi-sub" style={{color:buckets[2].n?"var(--amber)":undefined}}>{buckets[2].n} con más de 3 años</div>}
              {m.k==="lib" && n===0 && <div className="kpi-sub">Pendiente de contabilidad</div>}
            </div>
          );
        })}
      </div>

      <div className="vz-grid2">
        <div className="vz-card">
          <h4 className="vz-h4">📊 Valor por comuna (UF)</h4>
          <div className="chart-scroll">
            <svg viewBox={`0 0 ${W} ${chH+padT+padB}`} style={{width:"100%",minWidth:420,height:"auto",display:"block"}}>
              {[0,0.25,0.5,0.75,1].map(t=>{ const y=padT+chH*(1-t); return <g key={t}>
                <line x1={padL} y1={y} x2={W-10} y2={y} stroke="var(--line)" strokeWidth="1"/>
                <text x={padL-6} y={y+4} textAnchor="end" fontSize="10" fill="var(--ink3)">{fmtCorto(maxV*t)}</text></g>; })}
              {porComuna.map((g,i)=>{
                const x0 = padL + i*(gW+gOut) + gOut/2;
                return <g key={g.comuna}>
                  {serie.map((m,j)=>{ const h=(g[m.k]/maxV)*chH; return h>0 &&
                    <rect key={m.k} x={x0+j*(bw+gIn)} y={padT+chH-h} width={bw} height={h} fill={m.color} rx="2"><title>{g.comuna} · {m.lbl}: {fmtUFv(g[m.k])}</title></rect>; })}
                  <text x={x0+gW/2} y={padT+chH+15} textAnchor="middle" fontSize="10" fill="var(--ink2)">{g.comuna}</text>
                </g>;
              })}
              <line x1={padL} y1={padT+chH} x2={W-10} y2={padT+chH} stroke="var(--ink3)" strokeWidth="1.5"/>
            </svg>
          </div>
          <div className="vz-legend">{serie.map(m=><span key={m.k}><i style={{background:m.color}}/>{m.lbl}</span>)}</div>
        </div>

        <div className="vz-card">
          <h4 className="vz-h4">🏦 Garantías por banco</h4>
          <table className="vz-mini">
            <thead><tr><th style={{textAlign:"left"}}>Hipoteca</th><th>Lotes</th><th>m² neto</th><th>Comercial</th><th>% comercial</th><th>Tasación</th></tr></thead>
            <tbody>
              {filasBanco.map(b=>(
                <tr key={b.banco}>
                  <td style={{textAlign:"left",fontWeight:600,color:b.banco==="Libre"?"var(--green)":"var(--ink)"}}>{b.banco==="Libre"?"Libre (sin hipoteca)":b.banco}</td>
                  <td>{b.n}</td><td>{fmtN0(b.m2)}</td><td>{fmtUFv(b.com)}</td>
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:6,justifyContent:"flex-end"}}>
                      <div className="vz-bar-track" style={{width:44}}><div className="vz-bar-fill" style={{width:(totCom>0?b.com/totCom*100:0)+"%",background:b.banco==="Libre"?"var(--green)":"#b7620a"}}/></div>
                      {totCom>0?Math.round(b.com/totCom*100):0}%
                    </div>
                  </td>
                  <td>{b.tas>0?fmtUFv(b.tas):"—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="chart-help">Valor de los lotes según el banco que tiene la hipoteca. "Libre" son los lotes sin hipoteca.</div>
        </div>

        <div className="vz-card">
          <h4 className="vz-h4">🏆 Los 10 lotes de mayor valor comercial</h4>
          {top.map((l,i)=>(
            <div key={l.key} className="vz-top" onClick={()=>onOpen(l.key)} title="Ver ficha del lote">
              <span className="vz-top-n">{i+1}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:12}}>
                  <span style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.nombre} <span style={{color:"var(--ink3)",fontWeight:400}}>· {l.comuna}</span></span>
                  <span style={{whiteSpace:"nowrap"}}>{fmtUFv(l.comUf)} <span style={{color:"var(--ink3)"}}>({totCom>0?Math.round(l.comUf/totCom*100):0}%)</span></span>
                </div>
                <div className="vz-bar-track" style={{height:6,marginTop:4}}><div className="vz-bar-fill" style={{width:(l.comUf/maxTop*100)+"%",background:"#b7620a"}}/></div>
              </div>
            </div>
          ))}
          {top.length===0 && <div className="dt-empty">Sin datos</div>}
        </div>

        <div className="vz-card">
          <h4 className="vz-h4">🗓 Antigüedad de las tasaciones</h4>
          <div style={{display:"flex",height:14,borderRadius:7,overflow:"hidden",margin:"4px 0 12px",background:"var(--bg2)"}}>
            {buckets.filter(b=>b.n>0).map(b=><div key={b.lbl} title={`${b.lbl}: ${b.n} lotes`} style={{width:(b.n/Math.max(1,vis.length)*100)+"%",background:b.color}}/>)}
          </div>
          <table className="vz-mini">
            <thead><tr><th style={{textAlign:"left"}}>Tasación</th><th>Lotes</th><th>m² neto</th><th>Comercial</th></tr></thead>
            <tbody>
              {buckets.map(b=>(
                <tr key={b.lbl}>
                  <td style={{textAlign:"left"}}><i className="vz-sw" style={{background:b.color}}/>{b.lbl}</td>
                  <td>{b.n}</td><td>{fmtN0(b.m2)}</td><td>{b.com>0?fmtUFv(b.com):"—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="chart-help">Sirve para ver qué lotes conviene volver a tasar.</div>
        </div>
      </div>

      <div className="vz-card" style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:12}}>
          <h4 className="vz-h4" style={{margin:0,marginRight:8}}>📋 Detalle por lote</h4>
          <span style={{fontSize:11,color:"var(--ink3)"}}>Columnas:</span>
          {VZ_GRUPOS.map(g=><span key={g.id} className={`vz-chip${grupos.includes(g.id)?" on":""}`} onClick={()=>toggleGrupo(g.id)}>{g.lbl}</span>)}
          <span style={{width:1,height:18,background:"var(--line)",margin:"0 4px"}}/>
          <span className={`vz-chip${agrupar?" on":""}`} onClick={()=>setAgrupar(a=>!a)}>Agrupar por comuna</span>
          {orden.col && <button className="btn btn-ghost btn-xs" onClick={()=>setOrden({col:null,dir:1})}>Volver al orden del Excel</button>}
        </div>
        <div className="vz-table-wrap">
          <table className="vz-table">
            <thead>
              <tr>
                <th className="c-first" rowSpan={2} onClick={()=>clickOrden("nombre")} style={{cursor:"pointer"}}>Lote · ROL{flecha("nombre")}</th>
                {gruposVis.map(g=><th key={g.id} className="grp" colSpan={cols.filter(c=>c.grupo===g.id).length}>{g.lbl}</th>)}
              </tr>
              <tr>
                {cols.map((c,i)=><th key={c.id} className={`${c.txt?"c-txt":""} ${gIni(i)?"g-start":""}`} onClick={()=>clickOrden(c.id)} title="Ordenar">{c.lbl}{flecha(c.id)}</th>)}
              </tr>
            </thead>
            <tbody>
              {bloques.map(b=>(
                <React.Fragment key={b.titulo||"todos"}>
                  {b.lotes.map(l=>(
                    <tr key={l.key} className="lote" onClick={()=>onOpen(l.key)}>
                      <td className="c-first">
                        <div style={{fontWeight:600}}>{l.nombre}</div>
                        <div style={{fontSize:10.5,color:"var(--ink3)",fontFamily:"monospace"}}>
                          {l.rol||"sin ROL"}{l.obs && <span title={l.obs} style={{color:"var(--amber)",fontFamily:"inherit",marginLeft:6}}>⚠ obs.</span>}
                        </div>
                      </td>
                      {cols.map((c,i)=>{ const v=valorCol(c,l); return (
                        <td key={c.id} className={`${c.txt?"c-txt":""} ${c.wide?"c-wide":""} ${gIni(i)?"g-start":""}`} style={c.estilo?c.estilo(l):undefined}>
                          {vacioVz(v) ? <span style={{color:"var(--ink3)"}}>—</span> : (c.fmt ? c.fmt(v) : v)}
                        </td>); })}
                    </tr>
                  ))}
                  {b.titulo && filaTotales(b.lotes, "subtot", b.titulo)}
                </React.Fragment>
              ))}
              {filaTotales(vis, "total", "TOTAL")}
            </tbody>
          </table>
        </div>
        <div className="chart-help">Haz clic en un lote para ver su ficha. Haz clic en un título para ordenar. Los UF/m² de los totales son promedios ponderados. Fechas de tasación en naranjo: más de 3 años.</div>
      </div>
    </>
  );
}

  useEffect(()=>{ setEditObs(false); setObsTxt(lote.obs||""); },[lote.key, lote.obs]);

  const rankCom = lote.comUf>0 ? [...pares].filter(l=>l.comUf>0).sort((a,b)=>b.comUf-a.comUf).findIndex(l=>l.key===lote.key)+1 : 0;
  const nComCom = pares.filter(l=>l.comUf>0).length;

            <div style={{display:"flex",gap:6}}>

              <button className="btn btn-outline btn-sm" disabled={!next} onClick={()=>next&&onNav(next.key)} title={next?next.nombre:""}>Siguiente →</button>

      <div className="vz-sup">
        {[["Superficie bruta",lote.m2Bruto],["Superficie neta",lote.m2Neto],["Superficie SII",lote.m2Sii]].map(([lbl,v])=>(
          <div key={lbl} className="vz-sup-item"><div style={lblMin}>{lbl}</div><div style={{fontSize:16,fontWeight:700,marginTop:3}}>{fmtM2v(v)}</div></div>

          <div style={lblMin}>Neta vs SII</div>

      <div className="vz-grid2">
        <div className="vz-card">

              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                <span style={{color:"var(--ink2)"}}>{m.lbl}</span><span style={{fontWeight:600}}>{v?fmtUFv(v):"Sin dato"}</span>
              </div>
              <div className="vz-bar-track"><div className="vz-bar-fill" style={{width:(v?v/maxUf*100:0)+"%",background:m.color}}/></div>
            </div>); })}
          {lote.comUf>0 && lote.tasUf>0 && (
            <div className="chart-help">La tasación es {difTxt(lote.tasUf/lote.comUf-1)} que el valor comercial.</div>
          )}
        </div>
        <div className="vz-card">
          <h4 className="vz-h4">📍 Frente a su comuna ({lote.comuna||"—"})</h4>
          <table className="vz-mini">
            <thead><tr><th style={{textAlign:"left"}}>UF/m²</th><th>Este lote</th><th>Promedio comuna</th><th>Diferencia</th></tr></thead>
            <tbody>
              {VZ_METRICAS.map(m=>{ const a=lote[m.m2], p=promM2(pares,m.uf,m.base); const d=(a>0&&p>0)?a/p-1:null; return (
                <tr key={m.k}>
                  <td style={{textAlign:"left"}}>{m.lbl}</td>
                  <td>{a?fmtN2(a):"—"}</td><td>{p?fmtN2(p):"—"}</td>
                  <td style={{color:d===null?"var(--ink3)":d>=0?"var(--green)":"var(--red)",fontWeight:600}}>{fmtPctV(d)}</td>
                </tr>); })}

          </table>
          <div className="chart-help">
            {rankCom>0 ? `Es el n° ${rankCom} de ${nComCom} lotes de la comuna en valor comercial. ` : ""}
            El promedio es ponderado por superficie ({pares.length} lote{pares.length===1?"":"s"} en {lote.comuna||"la comuna"}).
          </div>
        </div>
      </div>

      <div className="vz-card" style={{marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <h4 className="vz-h4" style={{margin:0}}>📝 Observaciones</h4>
          {!editObs && <button className="btn btn-outline btn-xs" style={{marginLeft:"auto"}} onClick={()=>setEditObs(true)}>✏️ Editar</button>}

        {editObs ? (

// ── Carga de un Excel actualizado ──
// Lee la hoja "Base" con el mismo formato que "BASE DATOS TERRENOS" (títulos en la fila 4, lotes
// desde la fila 5), muestra qué cambia y reemplaza los datos en una sola operación en la base
// (función reemplazar_valores), que antes guarda una copia de lo que había para poder restaurarla.
const VZ_CAMPOS = [["nombre","Nombre"],["propietario","Propietario"],["comuna","Comuna"],["proyecto","Proyecto"],["detalle","Detalle"],["hipoteca","Hipoteca"],
  ["m2_bruto","m² bruto"],["m2_neto","m² neto"],["sii_m2","m² SII"],["sii_clp","Avalúo SII $"],["sii_fecha","Fecha avalúo"],
  ["com_uf","Comercial UF"],["com_uf_m2","Comercial UF/m²"],["tas_uf","Tasación UF"],["tas_uf_m2","Tasación UF/m²"],["tas_fecha","Fecha tasación"],
  ["libro_clp","Valor libro $"],["libro_uf","Valor libro UF"],["libro_uf_m2","Valor libro UF/m²"],["libro_fecha","Fecha valor libro"]];
const VZ_NUM = new Set(["m2_bruto","m2_neto","sii_m2","sii_clp","com_uf","com_uf_m2","tas_uf","tas_uf_m2","libro_clp","libro_uf","libro_uf_m2"]);
// Clave para reconocer un lote entre dos cargas: su ROL (100-05 = 100-5) o, si no tiene, su nombre
const normRol = r => String(r).trim().split("-").map(p=>/^\d+$/.test(p.trim()) ? String(parseInt(p,10)) : p.trim().toUpperCase()).join("-");
const claveLote = f => f.rol ? "R:"+normRol(f.rol) : "N:"+String(f.nombre||"").trim().toLowerCase();
function igualVz(campo, a, b){
  const va = vacioVz(a)?null:a, vb = vacioVz(b)?null:b;
  if(va===null && vb===null) return true;
  if(va===null || vb===null) return false;
  if(VZ_NUM.has(campo)){ const x=Number(va), y=Number(vb); return Math.abs(x-y) <= 0.001 + Math.abs(y)*1e-9; }
  if(/fecha/.test(campo)) return String(va).slice(0,10)===String(vb).slice(0,10);
  return String(va).trim()===String(vb).trim();
}
function compararValores(actuales, nuevas){
  const indexar = filas => { const m=new Map(); filas.forEach(f=>{ let k=claveLote(f), i=2; while(m.has(k)) k=claveLote(f)+"#"+(i++); m.set(k,f); }); return m; };
  const A=indexar(actuales), N=indexar(nuevas);
  const nuevos=[], eliminados=[], cambios=[]; let iguales=0;
  N.forEach((f,k)=>{
    const a=A.get(k);
    if(!a){ nuevos.push(f); return; }
    const cs = VZ_CAMPOS.filter(([c])=>!igualVz(c,a[c],f[c])).map(([c,lbl])=>({campo:c, lbl, antes:a[c], despues:f[c]}));
    if(cs.length) cambios.push({fila:f, cambios:cs}); else iguales++;
  });
  A.forEach((a,k)=>{ if(!N.has(k)) eliminados.push(a); });
  return {nuevos, eliminados, cambios, iguales};
}
const fmtCampoVz = (campo, v) => {
  if(vacioVz(v)) return "—";
  if(/_clp$/.test(campo)) return fmtCLP(v);
  if(/fecha/.test(campo)) return fmtDate(v);
  if(/^(m2_|sii_m2)/.test(campo)) return fmtM2v(v);
  if(VZ_NUM.has(campo)) return Number(v).toLocaleString("es-CL",{maximumFractionDigits:2});
  return String(v);
};
function leerExcelValores(buf, terrenos){
  if(typeof XLSX === "undefined") throw new Error("La librería de Excel aún no cargó. Refresca la página e intenta de nuevo.");
  const wb = XLSX.read(buf, {type:"array", cellNF:true});
  const ws = wb.Sheets["Base"] || wb.Sheets[wb.SheetNames[0]];
  if(!ws || !ws["!ref"]) throw new Error("El archivo no tiene una hoja con datos.");
  const val = a => { const c=ws[a]; return c ? c.v : null; };
  // Fecha de una celda con formato de fecha (Excel guarda los días desde 1899-12-30)
  const fecha = a => {
    const c = ws[a]; if(!c) return null;
    if(c.t==="d" && c.v instanceof Date && !isNaN(c.v)) return c.v.toISOString().slice(0,10);
    if(c.t==="n" && c.v>0 && c.z && XLSX.SSF.is_date(c.z)) return new Date(Date.UTC(1899,11,30)+Math.round(c.v)*86400000).toISOString().slice(0,10);
    return null;
  };
  const titulo = c => String(val(c+"4")||"").trim().toLowerCase();
  if(titulo("A")!=="rol" || titulo("B")!=="terreno" || titulo("K")!=="clp")
    throw new Error('El archivo no tiene el formato esperado: en la fila 4 deben estar los títulos "ROL", "Terreno", …, igual que en "BASE DATOS TERRENOS" (hoja Base).');
  const num = x => (typeof x==="number" && isFinite(x)) ? x : null;           // "n.a." → sin dato
  const txt = x => { if(x===null||x===undefined) return null; const s=String(x).trim(); return s||null; };
  // El ROL se guarda con el formato que usa la página cuando es el mismo número (ej. 100-05 → 100-5)
  const partes = r => String(r).split("-").map(p=>parseInt(p,10));
  const formatoPagina = r => {
    if(!r) return r;
    const pr = partes(r);
    const t = (terrenos||[]).find(t=>{ const pt=partes(t.rol); return pt.length===pr.length && pt.every((n,i)=>n===pr[i]); });
    return t ? t.rol : r;
  };
  const ultima = XLSX.utils.decode_range(ws["!ref"]).e.r + 1;
  const filas = [];
  for(let r=5; r<=ultima; r++){
    const rol = txt(val("A"+r)), nombre = txt(val("B"+r));
    if(!rol && !nombre) continue;
    const tasM2 = num(val("T"+r)); // sin UF/m² de tasación no hay tasación (el 0 que calcula el Excel es "sin dato")
    filas.push({orden:r, rol:formatoPagina(rol), rol_padre:null, nombre,
      propietario:txt(val("C"+r)), comuna:txt(val("D"+r)), proyecto:txt(val("E"+r)), detalle:txt(val("F"+r)),
      m2_bruto:num(val("G"+r)), m2_neto:num(val("H"+r)), hipoteca:txt(val("I"+r)),
      sii_m2:num(val("J"+r)), sii_clp:num(val("K"+r)), sii_fecha:fecha("N"+r),
      com_uf:num(val("P"+r)), com_uf_m2:num(val("Q"+r)),
      tas_uf: tasM2 ? num(val("S"+r)) : null, tas_uf_m2: tasM2, tas_fecha: tasM2 ? fecha("U"+r) : null,
      libro_clp:num(val("V"+r)), libro_uf:num(val("W"+r)), libro_uf_m2:num(val("X"+r)), libro_fecha:fecha("Y"+r),
      obs:null});
  }
  if(filas.length===0) throw new Error("No encontré lotes desde la fila 5.");
  return filas;
}
function ImportarValoresModal({actuales, terrenos, ufClp, onClose, onListo}){
  const [nuevas,setNuevas]=useState(null);
  const [archivo,setArchivo]=useState("");
  const [error,setError]=useState("");
  const [hist,setHist]=useState(null);
  const [verCambios,setVerCambios]=useState(true);
  const [busy,setBusy]=useState(false);
  useEffect(()=>{
    db.select("valores_importaciones","select=id,created_at,usuario,archivo,n_previas,n_nuevas&order=created_at.desc&limit=10")
      .then(r=>setHist(r||[])).catch(()=>setHist([]));
  },[]);
  const leer = async e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    setError(""); setNuevas(null);
    try{ setNuevas(leerExcelValores(await f.arrayBuffer(), terrenos)); setArchivo(f.name); }
    catch(err){ setError(err.message); }
    e.target.value = "";
  };
  const dif = nuevas ? compararValores(actuales, nuevas) : null;
  const resumen = filas => { const ls=prepararLotes(filas, ufClp); return {n:ls.length, m2:sumar(ls,"m2Neto"), sii:sumar(ls,"siiClp"), com:sumar(ls,"comUf"), tas:sumar(ls,"tasUf"), lib:sumar(ls,"libUf")}; };
  const rA = resumen(actuales), rN = nuevas ? resumen(nuevas) : null;
  const confirmar = async () => {
    setBusy(true); setError("");
    try{
      // Las observaciones escritas en la página se conservan para los lotes que siguen en el Excel
      const previas = {}; actuales.forEach(a=>{ previas[claveLote(a)] = a; });
      const filas = nuevas.map(f=>{ const a=previas[claveLote(f)]||{}; return {...f, obs:a.obs||null, rol_padre:a.rol_padre||null}; });
      await db.rpc("reemplazar_valores", {p_filas:filas, p_archivo:archivo});
      logAudit("cargar_valores", `Cargó el Excel de valorización "${archivo}": ${filas.length} lotes (${dif.nuevos.length} nuevos, ${dif.eliminados.length} eliminados, ${dif.cambios.length} con cambios)`, "");
      onListo();
    }catch(err){ setError("No se pudo guardar: "+err.message); setBusy(false); }
  };
  const restaurar = async h => {
    const cuando = new Date(h.created_at).toLocaleString("es-CL");
    if(!confirm(`¿Volver a los datos que había antes de la carga del ${cuando}?\n\nLos datos actuales quedan guardados en el historial, así que esto también se puede deshacer.`)) return;
    setBusy(true); setError("");
    try{
      const r = await db.select("valores_importaciones","id=eq."+h.id+"&select=filas_previas");
      const filas = (r[0] && r[0].filas_previas) || [];
      if(!filas.length) throw new Error("Esa copia está vacía.");
      await db.rpc("reemplazar_valores", {p_filas:filas, p_archivo:"Restauración: datos previos a la carga del "+cuando});
      logAudit("restaurar_valores", `Restauró la valorización a los datos previos a la carga del ${cuando} (${filas.length} lotes)`, "");
      onListo();
    }catch(err){ setError("No se pudo restaurar: "+err.message); setBusy(false); }
  };
  const fila = (lbl, a, n, fmt) => (
    <tr><td style={{textAlign:"left"}}>{lbl}</td><td>{fmt(a)}</td><td>{fmt(n)}</td>
      <td style={{color:Math.abs(n-a)<0.5?"var(--ink3)":"var(--ink)",fontWeight:Math.abs(n-a)<0.5?400:600}}>{Math.abs(n-a)<0.5?"=":(n>a?"+":"−")+fmt(Math.abs(n-a))}</td></tr>
  );
  return (
    <Modal title="⇪ Cargar Excel de valorización" onClose={onClose} large footer={
      <>
        <button className="btn btn-ghost btn-sm" onClick={onClose} disabled={busy}>Cancelar</button>
        {dif && <button className="btn btn-primary btn-sm" onClick={confirmar} disabled={busy || (dif.nuevos.length+dif.eliminados.length+dif.cambios.length===0)}>
          {busy ? "Guardando..." : (dif.nuevos.length+dif.eliminados.length+dif.cambios.length===0 ? "No hay cambios" : "Reemplazar datos con este Excel")}
        </button>}
      </>}>
      <div style={{fontSize:12.5,color:"var(--ink2)",lineHeight:1.55,marginBottom:12}}>
        Elige el Excel actualizado con el mismo formato que <b>BASE DATOS TERRENOS</b> (hoja <b>Base</b>: títulos en la fila 4 y lotes desde la fila 5).
        Antes de guardar vas a ver qué cambia. Al confirmar se guarda una copia de los datos actuales, que puedes restaurar desde el historial de abajo.
      </div>
      <label className="btn btn-outline btn-sm" style={{display:"inline-flex",cursor:"pointer"}}>
        📂 Elegir archivo Excel
        <input type="file" accept=".xlsx,.xlsm,.xls" onChange={leer} style={{display:"none"}}/>
      </label>
      {archivo && <span style={{marginLeft:10,fontSize:12,color:"var(--ink3)"}}>{archivo}</span>}
      {error && <div style={{marginTop:10,padding:"8px 12px",background:"var(--red-lt)",color:"var(--red)",borderRadius:6,fontSize:12.5}}>{error}</div>}

      {dif && (
        <div style={{marginTop:14}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
            <span className="vz-chip">{nuevas.length} lotes en el archivo</span>
            <span className="vz-chip" style={dif.nuevos.length?{borderColor:"var(--green)",color:"var(--green)"}:undefined}>{dif.nuevos.length} nuevos</span>
            <span className="vz-chip" style={dif.eliminados.length?{borderColor:"var(--red)",color:"var(--red)"}:undefined}>{dif.eliminados.length} ya no están</span>
            <span className="vz-chip" style={dif.cambios.length?{borderColor:"var(--amber)",color:"var(--amber)"}:undefined}>{dif.cambios.length} con cambios</span>
            <span className="vz-chip">{dif.iguales} sin cambios</span>
          </div>
          <table className="vz-mini" style={{marginBottom:12}}>
            <thead><tr><th style={{textAlign:"left"}}>Totales</th><th>Hoy</th><th>Con el archivo</th><th>Diferencia</th></tr></thead>
            <tbody>
              {fila("Lotes", rA.n, rN.n, v=>fmtN0(v))}
              {fila("m² neto", rA.m2, rN.m2, v=>fmtM2n(v))}
              {fila("Avalúo SII", rA.sii, rN.sii, v=>fmtCLP(v))}
              {fila("Comercial (UF)", rA.com, rN.com, v=>fmtN0(v))}
              {fila("Tasación (UF)", rA.tas, rN.tas, v=>fmtN0(v))}
              {fila("Valor libro (UF)", rA.lib, rN.lib, v=>fmtN0(v))}
            </tbody>
          </table>
          {(dif.nuevos.length+dif.eliminados.length+dif.cambios.length)>0 && (
            <div style={{border:"1px solid var(--line)",borderRadius:8,maxHeight:260,overflowY:"auto"}}>
              <div style={{padding:"8px 12px",background:"var(--bg)",fontSize:12,fontWeight:600,cursor:"pointer"}} onClick={()=>setVerCambios(v=>!v)}>{verCambios?"▼":"▶"} Detalle de lo que cambia</div>
              {verCambios && (
                <div style={{padding:"6px 12px 10px",fontSize:12,lineHeight:1.6}}>
                  {dif.nuevos.map(f=><div key={"n"+claveLote(f)} style={{color:"var(--green)"}}>＋ Nuevo: <b>{f.nombre}</b> {f.rol?`(${f.rol})`:""} — fila {f.orden}</div>)}
                  {dif.eliminados.map(f=><div key={"e"+claveLote(f)} style={{color:"var(--red)"}}>− Ya no está: <b>{f.nombre}</b> {f.rol?`(${f.rol})`:""}</div>)}
                  {dif.cambios.map(c=>(
                    <div key={"c"+claveLote(c.fila)} style={{marginTop:4}}>
                      <b>{c.fila.nombre}</b> {c.fila.rol?`(${c.fila.rol})`:""}
                      {c.cambios.map(x=><div key={x.campo} style={{paddingLeft:14,color:"var(--ink2)"}}>{x.lbl}: {fmtCampoVz(x.campo,x.antes)} → <b>{fmtCampoVz(x.campo,x.despues)}</b></div>)}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          <div style={{fontSize:11.5,color:"var(--ink3)",marginTop:8}}>Las observaciones escritas en la página se mantienen para los lotes que siguen en el archivo.</div>
        </div>
      )}

      <div style={{marginTop:18,borderTop:"1px solid var(--line)",paddingTop:12}}>
        <div style={{fontSize:12,fontWeight:600,color:"var(--ink2)",marginBottom:6}}>Historial de cargas</div>
        {hist===null ? <div style={{fontSize:12,color:"var(--ink3)"}}>Cargando…</div>
          : hist.length===0 ? <div style={{fontSize:12,color:"var(--ink3)"}}>Todavía no hay cargas desde la página.</div>
          : hist.map(h=>(
            <div key={h.id} style={{display:"flex",alignItems:"center",gap:10,fontSize:12,padding:"5px 0",borderBottom:"1px solid var(--line)"}}>
              <span style={{color:"var(--ink3)",minWidth:130}}>{new Date(h.created_at).toLocaleString("es-CL")}</span>
              <span style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.archivo||"—"} <span style={{color:"var(--ink3)"}}>· {h.usuario||""} · {h.n_previas} → {h.n_nuevas} lotes</span></span>
              <button className="btn btn-ghost btn-xs" onClick={()=>restaurar(h)} disabled={busy} title="Volver a los datos que había antes de esta carga">↺ Restaurar lo anterior</button>
            </div>
          ))}
      </div>
    </Modal>
  );
}

function Dashboard({terrenos, allCuotas, allBitacora, allDevoluciones=[], onSelectTerreno, hiddenRols, ufClp=40027, onSaveUfClp}) {
  const [subTab, setSubTab] = useState("principal");

  // Principal tab filters (multi-select)
  const [filterPeriodos, setFilterPeriodos] = useState([]); // ["2025-Q1","2025-Extras",...]
  const [filterCiudades, setFilterCiudades] = useState([]);
  const [filterProyectos, setFilterProyectos] = useState([]);
  const [filterVigente, setFilterVigente] = useState([]);
  const [filterSobretasa, setFilterSobretasa] = useState([]);
  const [expandedYears, setExpandedYears] = useState({});
  const [filterDevAnios, setFilterDevAnios] = useState([]); // años seleccionados en el gráfico de devoluciones

  // Tareas tab filters (multi-select)
  const [filterBitaCiudades, setFilterBitaCiudades] = useState([]);
  const [filterBitaResp, setFilterBitaResp] = useState([]);
  const [filterBitaEstado, setFilterBitaEstado] = useState(BITA_ESTADO_DEFAULT);

  const visTer = terrenos.filter(t=>!hiddenRols.has(t.rol));
  const visRols = new Set(visTer.map(t=>t.rol));
  const visCuotas = allCuotas.filter(c=>visRols.has(c.terreno_rol));
  const visBita = allBitacora.filter(b=>visRols.has(b.terreno_rol));
  const visDev = allDevoluciones.filter(d=>visRols.has(d.terreno_rol));

  // Filter option lists
  const ciudadOpts = [...new Set(visTer.map(t=>t.ciudad).filter(Boolean))].sort();
  // Proyecto: CASCADEADO por ciudad — si hay filtro de ciudad, solo proyectos de esas ciudades
  const terForProyOpts = filterCiudades.length>0
    ? visTer.filter(t=>filterCiudades.includes(t.ciudad))
    : visTer;
  const proyectoOpts = [...new Set(terForProyOpts.map(t=>t.proyecto).filter(Boolean))].sort();
  const respOpts = [...new Set(visBita.map(b=>b.responsable).filter(Boolean))].sort();

  // Apply principal filters across all portfolio-derived data
  const filTer = visTer.filter(t =>
    (filterCiudades.length===0 || filterCiudades.includes(t.ciudad))
    && (filterProyectos.length===0 || filterProyectos.includes(t.proyecto))
    && (filterVigente.length===0 || filterVigente.includes(estadoDe(t)))
    && (filterSobretasa.length===0 || filterSobretasa.includes(!!t.sobretasa))
  );
  const filRols = new Set(filTer.map(t=>t.rol));
  // filCuotas y filDev solo aplican los filtros principales.
  // Los períodos seleccionados en el chart SOLO filtran la tabla de proyectos.
  const filCuotas = visCuotas.filter(c=>filRols.has(c.terreno_rol));
  const filDev = visDev.filter(d=>filRols.has(d.terreno_rol));
  const filBita = visBita.filter(b=>filRols.has(b.terreno_rol));

  // ── Datos de PLATA (contribuciones / devoluciones) ──
  // A diferencia de los datos de portafolio (m², avalúo, sobretasa), las
  // contribuciones y devoluciones SÍ incluyen terrenos ocultos, porque ese
  // historial financiero existió aunque el terreno ya no esté activo
  // (ej: un terreno "madre" que se subdividió y se ocultó).
  const filTerMoney = terrenos.filter(t =>
    (filterCiudades.length===0 || filterCiudades.includes(t.ciudad))
    && (filterProyectos.length===0 || filterProyectos.includes(t.proyecto))
    && (filterVigente.length===0 || filterVigente.includes(estadoDe(t)))
    && (filterSobretasa.length===0 || filterSobretasa.includes(!!t.sobretasa))
  );
  const filRolsMoney = new Set(filTerMoney.map(t=>t.rol));
  const filCuotasMoney = allCuotas.filter(c=>filRolsMoney.has(c.terreno_rol));
  const filDevMoney = allDevoluciones.filter(d=>filRolsMoney.has(d.terreno_rol));

  // Auto-deseleccionar proyectos que ya no pertenecen a las ciudades filtradas
  useEffect(()=>{
    if(filterCiudades.length===0) return; // sin filtro de ciudad, no tocar proyectos
    const allowed = new Set(visTer.filter(t=>filterCiudades.includes(t.ciudad)).map(t=>t.proyecto).filter(Boolean));
    setFilterProyectos(curr => curr.filter(p => allowed.has(p)));
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [filterCiudades.join("|")]);

  const anio = new Date().getFullYear();
  // Tarjetas Contribuciones / Devoluciones / Neto → incluyen ocultos
  const contribAnio = filCuotasMoney.filter(c=>c.anio===anio).reduce((s,c)=>s+(parseInt(c.monto)||0),0);
  // Devoluciones en caja del año: solo las concretadas, según la fecha en que se concretaron.
  const devAnioList = filDevMoney.filter(d=>devConcretada(d) && (devFechaCaja(d)||"").startsWith(anio+"-"));
  const devAnio = devAnioList.reduce((s,d)=>s+(parseInt(d.monto)||0),0);
  // En proceso: todavía no entran a caja (no suman al Neto); se muestran como potencial.
  const devEnProceso = filDevMoney.filter(d=>!devConcretada(d));
  const devEnProcesoTotal = devEnProceso.reduce((s,d)=>s+(parseInt(d.monto)||0),0);
  const netoAnio = contribAnio - devAnio;

  const yearlyMap={};
  const getYearBucket = (y) => {
    if(!yearlyMap[y]) yearlyMap[y] = {anio:y, contrib:0, dev:0, byTerreno:{}};
    return yearlyMap[y];
  };
  const getTerBucket = (yb, rol) => {
    if(!yb.byTerreno[rol]) yb.byTerreno[rol] = {rol, contrib:0, dev:0};
    return yb.byTerreno[rol];
  };
  // Balance anual (incluye ocultos)
  filCuotasMoney.forEach(c=>{
    const yb = getYearBucket(c.anio);
    const tb = getTerBucket(yb, c.terreno_rol);
    const m = parseInt(c.monto)||0;
    yb.contrib += m;
    tb.contrib += m;
  });
  filDevMoney.forEach(d=>{
    // Balance en caja: solo concretadas, en el año en que se concretaron.
    if(!devConcretada(d) || !devFechaCaja(d)) return;
    const y = parseInt(devFechaCaja(d).slice(0,4));
    const yb = getYearBucket(y);
    const tb = getTerBucket(yb, d.terreno_rol);
    const m = parseInt(d.monto)||0;
    yb.dev += m;
    tb.dev += m;
  });
  const yearly = Object.values(yearlyMap).sort((a,b)=>b.anio-a.anio);
  // terrMap incluye ocultos para resolver nombres en el desglose del balance
  const terrMap = {};
  filTerMoney.forEach(t=>{terrMap[t.rol]=t;});

  const totalM2 = filTer.reduce((s,t)=>s+(parseFloat(t.m2_sii)||0),0);
  const totalAvaluo = filTer.reduce((s,t)=>s+(parseInt(t.avaluo)||0),0);

  const sobretasaSI = filTer.filter(t=>t.sobretasa);
  const sobretasaNO = filTer.filter(t=>!t.sobretasa);
  const rolsConSobre = new Set(sobretasaSI.map(t=>t.rol));
  // Totales de sobretasa: SOLO del año en curso (no todos los años)
  const totalConSobre = filCuotas.filter(c=>c.anio===anio && rolsConSobre.has(c.terreno_rol)).reduce((s,c)=>s+(parseInt(c.monto)||0),0);
  const totalSinSobre = filCuotas.filter(c=>c.anio===anio && !rolsConSobre.has(c.terreno_rol)).reduce((s,c)=>s+(parseInt(c.monto)||0),0);
  const pendingBita = filBita.filter(b=>b.estatus==="Pendiente"||b.estatus==="En Proceso");

  // Contribuciones por ciudad → incluye ocultos (es desglose de contribuciones)
  const byCiudad={};
  filTerMoney.forEach(t=>{
    if(!byCiudad[t.ciudad]) byCiudad[t.ciudad]={n:0,imp:0};
    byCiudad[t.ciudad].n++;
  });
  filCuotasMoney.filter(c=>c.anio===anio).forEach(c=>{
    const t=filTerMoney.find(x=>x.rol===c.terreno_rol);
    if(t&&byCiudad[t.ciudad]) byCiudad[t.ciudad].imp+=parseInt(c.monto)||0;
  });

  // ── Cuotas vencidas (alerta) → usa el set con ocultos para no perder deuda histórica ──
  const hoy = today();
  const diasVencida = (fv) => { try{ return Math.max(0, Math.floor((new Date(hoy) - new Date(fv))/86400000)); }catch{ return 0; } };
  const overdueCuotas = filCuotasMoney
    .filter(c => !c.pagado && c.fecha_vencimiento && c.fecha_vencimiento < hoy)
    .map(c => {
      const t = terrMap[c.terreno_rol] || {};
      return {
        ...c,
        _nombre: t.terreno || c.terreno_rol,
        _proyecto: (t.proyecto && String(t.proyecto).trim()) || (t.terreno || c.terreno_rol),
        _dias: diasVencida(c.fecha_vencimiento),
        _periodo: c.numero>4 ? `${c.anio}-Extra` : `${c.anio}-Q${c.numero}`
      };
    })
    .sort((a,b) => b._dias - a._dias);
  const overdueTotal = overdueCuotas.reduce((s,c)=>s+(parseInt(c.monto)||0),0);

  const hasPrincipalFilters = filterCiudades.length||filterProyectos.length||filterVigente.length||filterSobretasa.length;
  const clearPrincipalFilters = () => {
    setFilterCiudades([]); setFilterProyectos([]); setFilterVigente([]); setFilterSobretasa([]);
  };
  const togglePeriodo = (p) => {
    setFilterPeriodos(curr => curr.includes(p) ? curr.filter(x=>x!==p) : [...curr, p]);
  };
  const toggleDevAnio = (y) => {
    setFilterDevAnios(curr => curr.includes(y) ? curr.filter(x=>x!==y) : [...curr, y]);
  };
  // Conversión CLP → UF (la tasa la maneja el usuario en la barra de arriba)
  const fmtUF = (clp) => {
    if(!ufClp || ufClp<=0) return "";
    return Math.round((parseFloat(clp)||0)/ufClp).toLocaleString("es-CL")+" UF";
  };

  // ── Tareas tab (independent filters) ──
  const bitaFiltered = visBita.filter(b=>{
    const t = visTer.find(x=>x.rol===b.terreno_rol);
    return (filterBitaCiudades.length===0 || (t && filterBitaCiudades.includes(t.ciudad)))
      && (filterBitaResp.length===0 || filterBitaResp.includes(b.responsable))
      && (filterBitaEstado.length===0 || filterBitaEstado.includes(b.estatus));
  });

  // La lista de abajo muestra exactamente lo filtrado y sin tope de filas, así siempre calza con
  // el contador y la tabla por responsable. Al entrar, el filtro trae Pendiente + En Proceso.
  const bitaEstadoDefault = filterBitaEstado.length===BITA_ESTADO_DEFAULT.length
    && BITA_ESTADO_DEFAULT.every(e=>filterBitaEstado.includes(e));
  const bitaEstadoLbl = bitaEstadoDefault ? "activas"
    : filterBitaEstado.length ? filterBitaEstado.join(" / ") : "todas";
  const bitaOtrosFiltros = filterBitaCiudades.length||filterBitaResp.length;
  // Más reciente arriba y más antigua abajo, por fecha de ingreso (si empatan, por hora de carga).
  const bitaOrdenada = [...bitaFiltered].sort((a,b)=>
    (b.fecha||"").localeCompare(a.fecha||"") || String(b.created_at||"").localeCompare(String(a.created_at||"")));
  // Columnas proporcionales: el detalle se lleva la mayor parte del ancho, para que en pantallas
  // más angostas no quede en una columna delgada que estira las filas hacia abajo.
  const colsBita = "84px minmax(130px,0.75fr) minmax(0,2.4fr) 72px 96px minmax(100px,0.6fr)";

  const respMap={};
  bitaFiltered.forEach(b=>{
    const r=b.responsable||'Sin asignar';
    if(!respMap[r]) respMap[r]={name:r,total:0,pendiente:0,proceso:0,finalizada:0};
    respMap[r].total++;
    if(b.estatus==='Pendiente') respMap[r].pendiente++;
    else if(b.estatus==='En Proceso') respMap[r].proceso++;
    else if(b.estatus==='Finalizada') respMap[r].finalizada++;
  });
  const respList = Object.values(respMap).sort((a,b)=>b.total-a.total);

  const hasBitaFilters = filterBitaCiudades.length||filterBitaResp.length||!bitaEstadoDefault;
  const clearBitaFilters = () => {
    setFilterBitaCiudades([]); setFilterBitaResp([]); setFilterBitaEstado(BITA_ESTADO_DEFAULT);
  };

  const SOBRETASA_OPTS = [{value:true,label:"Con sobretasa"},{value:false,label:"Sin sobretasa"}];
  const VIGENTE_OPTS = ESTADOS; // filtro por estado del terreno

  return (
    <>
      <div className="dash-subtabs">
        <button className={"dash-subtab"+(subTab==="principal"?" active":"")} onClick={()=>setSubTab("principal")}>📊 Principal</button>
        <button className={"dash-subtab"+(subTab==="tareas"?" active":"")} onClick={()=>setSubTab("tareas")}>📓 Tareas / Bitácora</button>
      </div>

      {subTab==="principal" && (
        <>
          <UfEditor ufClp={ufClp} onSave={onSaveUfClp}/>
          <div className="dash-filter-bar">
            <label style={{marginRight:4}}>Portafolio:</label>
            <MultiSelect label="Ciudad" options={ciudadOpts} selected={filterCiudades} onChange={setFilterCiudades}/>
            <MultiSelect label="Proyecto" options={proyectoOpts} selected={filterProyectos} onChange={setFilterProyectos}/>
            <MultiSelect label="Estado" options={VIGENTE_OPTS} selected={filterVigente} onChange={setFilterVigente}/>
            <MultiSelect label="Sobretasa" options={SOBRETASA_OPTS} selected={filterSobretasa} onChange={setFilterSobretasa}/>
            {hasPrincipalFilters?<button className="dash-clr" onClick={clearPrincipalFilters}>✕ Limpiar filtros</button>:null}
            <span style={{marginLeft:"auto",fontSize:11,color:"var(--ink3)"}}>
              {filTer.length} terrenos{hasPrincipalFilters?` (de ${visTer.length})`:""}
            </span>
          </div>

          <div className="kpi-grid-5">
            <div className="kpi-card teal">
              <div className="kpi-label">Portafolio total</div>
              <div className="kpi-value">{Math.round(totalM2).toLocaleString("es-CL")}</div>
              <div className="kpi-sub">m² · {filTer.length} terrenos</div>
            </div>
            <div className="kpi-card teal">
              <div className="kpi-label">Avalúo fiscal global</div>
              <div className="kpi-value" style={{fontSize:15}}>{fmtCLP(totalAvaluo)}</div>
              <div className="kpi-sub">({fmtUF(totalAvaluo)}) · Según SII · {anio}</div>
            </div>
            <div className="kpi-card" style={{borderTopColor:"var(--red)"}}>
              <div className="kpi-label">Con sobretasa</div>
              <div className="kpi-value" style={{color:"var(--red)"}}>{sobretasaSI.length}</div>
              <div className="kpi-sub">Cuotas {anio}: {fmtCLP(totalConSobre)} ({fmtUF(totalConSobre)})</div>
            </div>
            <div className="kpi-card good">
              <div className="kpi-label">Sin sobretasa</div>
              <div className="kpi-value">{sobretasaNO.length}</div>
              <div className="kpi-sub">Cuotas {anio}: {fmtCLP(totalSinSobre)} ({fmtUF(totalSinSobre)})</div>
            </div>
            <div className={`kpi-card${pendingBita.length>0?" warning":""}`}>
              <div className="kpi-label">Tareas en bitácora</div>
              <div className="kpi-value">{pendingBita.length}</div>
              <div className="kpi-sub">Pendiente o en proceso</div>
            </div>
          </div>

          <div className="kpi-grid-5" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
            <div className="kpi-card teal">
              <div className="kpi-label">Contribuciones {anio}</div>
              <div className="kpi-value" style={{fontSize:16}}>{fmtCLP(contribAnio)}</div>
              <div className="kpi-sub">({fmtUF(contribAnio)}) · Total facturado en cuotas</div>
            </div>
            <div className="kpi-card" style={{borderTopColor:"var(--red)"}}>
              <div className="kpi-label">Devoluciones (caja) {anio}</div>
              <div className="kpi-value" style={{fontSize:16,color:"var(--red)"}}>{fmtCLP(devAnio)}</div>
              <div className="kpi-sub">({fmtUF(devAnio)}) · {devAnioList.length} concretada{devAnioList.length===1?"":"s"}</div>
              <div className="kpi-sub" style={{marginTop:3}}>
                {devEnProceso.length>0
                  ? <>En proceso: <b style={{color:"var(--amber)"}}>{fmtCLP(devEnProcesoTotal)}</b> ({devEnProceso.length}) · Potencial: <b style={{color:"var(--ink2)"}}>{fmtCLP(devAnio+devEnProcesoTotal)}</b></>
                  : "Sin devoluciones en proceso"}
              </div>
            </div>
            <div className="kpi-card" style={{borderTopColor:netoAnio>=0?"var(--green)":"var(--red)"}}>
              <div className="kpi-label">Neto {anio}</div>
              <div className="kpi-value" style={{fontSize:16,color:netoAnio>=0?"var(--green)":"var(--red)"}}>{fmtCLP(netoAnio)}</div>
              <div className="kpi-sub">({fmtUF(netoAnio)}) · Contribuciones − Devoluciones (caja)</div>
            </div>
          </div>

          <div className="dash-2col">
            <div className="dash-section">
              <h4>📍 Contribuciones {anio} por ciudad</h4>
              <div className="data-table">
                <div className="dt-head" style={{gridTemplateColumns:"1fr 60px 110px"}}>
                  <span>Ciudad</span><span style={{textAlign:"center"}}>Terrenos</span><span style={{textAlign:"right"}}>Total</span>
                </div>
                {Object.entries(byCiudad).sort((a,b)=>b[1].imp-a[1].imp).map(([city,d])=>(
                  <div key={city} className="dt-row" style={{gridTemplateColumns:"1fr 60px 110px"}}>
                    <span style={{fontWeight:600}}>{city}</span>
                    <span style={{textAlign:"center",color:"var(--ink3)"}}>{d.n}</span>
                    <span style={{textAlign:"right",color:"var(--ink2)"}}>{fmtCLP(d.imp)}</span>
                  </div>
                ))}
                {Object.keys(byCiudad).length===0&&<div className="dt-empty">Sin datos</div>}
              </div>
            </div>
            <div className="dash-section">
              <h4>⚖️ Desglose por sobretasa</h4>
              <SobretasaBreakdown
                sobretasaSI={sobretasaSI} sobretasaNO={sobretasaNO}
                cuotas={filCuotas} anio={anio}
                totalConSobre={totalConSobre} totalSinSobre={totalSinSobre}
                filTerLen={filTer.length}
                onSelectTerreno={onSelectTerreno}/>
            </div>
          </div>

          <div className="chart-card">
            <div className="chart-and-breakdown">
              <div>
                <h4>📈 Evolución de contribuciones por año y cuota</h4>
                <ContribChart cuotas={filCuotasMoney} selectedPeriods={filterPeriodos} onTogglePeriod={togglePeriodo}/>
                <div className="chart-help">Haz clic en una o más barras para filtrar el desglose de proyectos (puedes seleccionar varias).</div>
              </div>
              <ProyectosBreakdown
                terrenos={filTerMoney}
                cuotas={filCuotasMoney}

              <DevolProyectosBreakdown

          <div className="dash-section">
            <h4>📊 Balance anual — contribuciones vs devoluciones (caja)</h4>
            <div className="data-table">
              <div className="dt-head" style={{gridTemplateColumns:"minmax(260px,1.4fr) 1fr 1fr 1fr"}}>
                <span>Año</span>
                <span style={{textAlign:"right"}}>Contribuciones</span>
                <span style={{textAlign:"right"}}>Devoluciones (caja)</span>
                <span style={{textAlign:"right"}}>Neto</span>
              </div>
              {yearly.length===0?(
                <div className="dt-empty">Sin datos</div>
              ):yearly.map(y=>{
                const n = y.contrib - y.dev;
                const isOpen = !!expandedYears[y.anio];
                // Solo mostrar terrenos con contribuciones o devoluciones (>0)
                const terRows = Object.values(y.byTerreno)
                  .filter(t => (t.contrib||0)!==0 || (t.dev||0)!==0)
                  .sort((a,b)=>(b.contrib-b.dev)-(a.contrib-a.dev));
                return (
                  <React.Fragment key={y.anio}>
                    <div className="dt-row proy-row-clickable"
                      style={{gridTemplateColumns:"minmax(260px,1.4fr) 1fr 1fr 1fr"}}
                      onClick={()=>setExpandedYears(e=>({...e,[y.anio]:!e[y.anio]}))}
                      title="Click para ver desglose por terreno">
                      <span style={{fontWeight:700}}>
                        {y.anio}
                        {terRows.length>0 && <span className={"proy-expand-arrow"+(isOpen?" open":"")}>▶</span>}

                      <span style={{textAlign:"right",color:"var(--teal)",fontWeight:600}}>{fmtCLP(y.contrib)}</span>
                      <span style={{textAlign:"right",color:"var(--red)",fontWeight:600}}>{y.dev>0?"−":""}{fmtCLP(y.dev)}</span>
                      <span style={{textAlign:"right",fontWeight:700,color:n>=0?"var(--green)":"var(--red)"}}>{fmtCLP(n)}</span>
                    </div>
                    {isOpen && terRows.map(tr=>{
                      const ter = terrMap[tr.rol];
                      const tn = tr.contrib - tr.dev;
                      const nombre = ter?.terreno||tr.rol;
                      const hasSobretasa = !!ter?.sobretasa;
                      return (
                        <div key={y.anio+"-"+tr.rol} className="dt-row proy-subrow"
                          style={{gridTemplateColumns:"minmax(260px,1.4fr) 1fr 1fr 1fr"}}
                          onClick={(e)=>{e.stopPropagation(); onSelectTerreno && onSelectTerreno(tr.rol);}}
                          title={"Ir a "+nombre+(hasSobretasa?" (con sobretasa)":"")}>
                          <span style={{fontSize:11.5,color:"var(--ink2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                            └ {nombre}
                            {hasSobretasa && <span title="Con sobretasa" style={{display:"inline-block",marginLeft:6,minWidth:14,padding:"0 4px",fontSize:9.5,fontWeight:700,color:"#fff",background:"var(--red)",borderRadius:3,textAlign:"center",lineHeight:"14px",verticalAlign:"middle"}}>S</span>}
                            <span style={{color:"var(--ink3)",fontFamily:"monospace",fontSize:10,marginLeft:6}}>({tr.rol})</span>
                          </span>
                          <span style={{textAlign:"right",color:"var(--ink2)",fontSize:11.5,fontWeight:500}}>{fmtCLP(tr.contrib)}</span>
                          <span style={{textAlign:"right",color:tr.dev>0?"var(--red)":"var(--ink3)",fontSize:11.5,fontWeight:500}}>{tr.dev>0?"−":""}{fmtCLP(tr.dev)}</span>
                          <span style={{textAlign:"right",fontWeight:600,color:tn>=0?"var(--green)":"var(--red)",fontSize:11.5}}>{fmtCLP(tn)}</span>
                        </div>
                      );
                    })}
                  </React.Fragment>
                );
              })}
            </div>
          </div>

          {/* ── Alerta: cuotas de contribuciones vencidas, detalle por terreno ── */}
          <div className="dash-section">
            <h4 style={overdueCuotas.length>0?{color:"var(--red)"}:undefined}>
              {overdueCuotas.length>0 ? "⚠️" : "✅"} Cuotas vencidas — detalle por terreno
              {overdueCuotas.length>0 && (
                <span style={{marginLeft:8,fontSize:11,fontWeight:600,color:"#fff",background:"var(--red)",padding:"1px 9px",borderRadius:10}}>
                  {overdueCuotas.length} · {fmtCLP(overdueTotal)}
                </span>
              )}
            </h4>
            {overdueCuotas.length===0 ? (
              <div className="dt-empty" style={{color:"var(--green)"}}>✓ Sin cuotas vencidas. Todas las contribuciones al día.</div>
            ) : (
              <div className="data-table">
                <div className="dt-head" style={{gridTemplateColumns:"minmax(220px,1.4fr) 1fr 110px 90px 120px"}}>
                  <span>Terreno · ROL</span><span>Proyecto</span><span>Período</span><span style={{textAlign:"center"}}>Días</span><span style={{textAlign:"right"}}>Monto</span>
                </div>
                {overdueCuotas.map(c=>(
                  <div key={c.id} className="dt-row proy-row-clickable" style={{gridTemplateColumns:"minmax(220px,1.4fr) 1fr 110px 90px 120px"}}
                    onClick={()=>onSelectTerreno && onSelectTerreno(c.terreno_rol)}
                    title={"Ir a "+c._nombre}>
                    <span style={{minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      <span style={{fontWeight:600,fontSize:11.5}}>{c._nombre}</span>
                      <span style={{color:"var(--ink3)",fontFamily:"monospace",fontSize:10,marginLeft:6}}>({c.terreno_rol})</span>
                    </span>
                    <span style={{color:"var(--ink3)",fontSize:11.5,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c._proyecto}</span>
                    <span style={{fontSize:11.5,color:"var(--ink2)"}}>{c._periodo}</span>
                    <span style={{textAlign:"center"}}>
                      <span style={{fontSize:10.5,fontWeight:600,color:"#fff",background:c._dias>180?"var(--red)":"var(--amber)",padding:"1px 7px",borderRadius:9}}>{c._dias}d</span>
                    </span>
                    <span style={{textAlign:"right",fontWeight:600,color:"var(--red)",fontSize:12}}>{fmtCLP(c.monto)}</span>
                  </div>
                ))}
                <div className="dt-row" style={{gridTemplateColumns:"minmax(220px,1.4fr) 1fr 110px 90px 120px",background:"var(--bg2)",fontWeight:700}}>
                  <span>TOTAL VENCIDO</span><span></span><span></span>
                  <span style={{textAlign:"center"}}>{overdueCuotas.length}</span>
                  <span style={{textAlign:"right",color:"var(--red)"}}>{fmtCLP(overdueTotal)}</span>
                </div>
              </div>
            )}
          </div>
        </>
      )}

      {subTab==="tareas" && (
        <>
          <div className="dash-filter-bar">
            <label style={{marginRight:4}}>Bitácora:</label>
            <MultiSelect label="Ciudad" options={ciudadOpts} selected={filterBitaCiudades} onChange={setFilterBitaCiudades}/>
            <MultiSelect label="Responsable" options={respOpts} selected={filterBitaResp} onChange={setFilterBitaResp}/>
            <MultiSelect label="Estatus" options={ESTATUS_OPTS} selected={filterBitaEstado} onChange={setFilterBitaEstado}/>
            {hasBitaFilters?<button className="dash-clr" onClick={clearBitaFilters}>✕ Limpiar filtros</button>:null}
            <span style={{marginLeft:"auto",fontSize:11,color:"var(--ink3)"}}>
              {bitaFiltered.length} entradas{bitaFiltered.length!==visBita.length?` (de ${visBita.length})`:""}
            </span>
          </div>

          <div className="dash-section">
            <h4>👤 Tareas por responsable — {bitaEstadoLbl}{bitaOtrosFiltros?" — filtrado":""}</h4>
            <div className="resp-table">
              <div className="resp-table-head" style={{gridTemplateColumns:"1fr 70px 90px 90px 90px"}}>
                <span>Responsable</span>
                <span style={{textAlign:"center"}}>Total</span>
                <span style={{textAlign:"center",color:"var(--ink3)"}}>Pendiente</span>
                <span style={{textAlign:"center",color:"var(--teal)"}}>En Proceso</span>
                <span style={{textAlign:"center",color:"var(--green)"}}>Finalizada</span>
              </div>
              {respList.length===0
                ?<div className="dt-empty">Sin tareas registradas</div>
                :respList.map(r=>(
                  <div key={r.name} className="resp-table-row" style={{gridTemplateColumns:"1fr 70px 90px 90px 90px"}}>
                    <span style={{fontWeight:600}}>{r.name}</span>
                    <span style={{textAlign:"center",fontWeight:700}}>{r.total}</span>
                    <span style={{textAlign:"center"}}>{r.pendiente>0&&<span className="estatus-chip est-pendiente">{r.pendiente}</span>}</span>
                    <span style={{textAlign:"center"}}>{r.proceso>0&&<span className="estatus-chip est-proceso">{r.proceso}</span>}</span>
                    <span style={{textAlign:"center"}}>{r.finalizada>0&&<span className="estatus-chip est-finalizada">{r.finalizada}</span>}</span>
                  </div>
                ))
              }
            </div>
          </div>

          <div className="dash-section">
            <h4>📓 Bitácora — {bitaEstadoDefault?"tareas activas":bitaEstadoLbl}{bitaOtrosFiltros?" — filtrado":""} <span style={{fontWeight:400,color:"var(--ink3)",fontSize:11.5}}>({bitaFiltered.length})</span></h4>
            <div className="data-table">
              {bitaFiltered.length===0?(
                <div className="dt-empty">{bitaEstadoDefault?"✓ Sin tareas pendientes":"Sin tareas con ese filtro"}</div>
              ):(
                <>
                  <div className="dt-head" style={{gridTemplateColumns:colsBita,columnGap:"14px"}}>
                    <span>Ingreso</span><span>Terreno · ROL</span><span>Detalle</span><span style={{textAlign:"center"}}>Prioridad</span><span>Estatus</span><span>Responsable</span>
                  </div>
                  {bitaOrdenada.map(b=>{
                    const t=visTer.find(x=>x.rol===b.terreno_rol);
                    return (
                      <div key={b.id} className="dt-row" style={{gridTemplateColumns:colsBita,columnGap:"14px",cursor:"pointer"}} onClick={()=>onSelectTerreno(b.terreno_rol)}>
                        <div>
                          <div style={{fontSize:12,fontWeight:500}}>{fmtDate(b.fecha)}</div>
                          <div style={{color:"var(--ink3)",fontSize:10.5}}>{fmtAntiguedad(b.fecha)}</div>
                        </div>
                        <div>
                          <div style={{fontWeight:600,fontSize:11.5}}>{t?.terreno||b.terreno_rol}</div>
                          <div style={{color:"var(--ink3)",fontSize:10,fontFamily:"monospace"}}>{b.terreno_rol}</div>
                        </div>
                        <span style={{color:"var(--ink2)",fontSize:12,lineHeight:1.45,whiteSpace:"pre-wrap",overflowWrap:"anywhere"}}>{b.detalle||"—"}</span>
                        <span style={{textAlign:"center"}}>{b.prioridad&&<span className={`prio-chip prio-${b.prioridad.toLowerCase()}`}>{b.prioridad}</span>}</span>
                        <span><span className={`estatus-chip est-${b.estatus==="En Proceso"?"proceso":b.estatus.toLowerCase()}`}>{b.estatus}</span></span>
                        <span style={{fontSize:12,color:"var(--ink3)"}}>{b.responsable||"—"}</span>
